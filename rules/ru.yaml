    - id: locale.gateway.voice.enabled_short
      family: locale.gateway.voice
      from: Voice mode enabled.
      to: Голосовой режим включён.
    - id: locale.gateway.voice.disabled_short
      family: locale.gateway.voice
      from: Voice mode disabled.
      to: Голосовой режим отключён.
    - id: locale.gateway.voice.label_off
      family: locale.gateway.voice
      from: Off (text only)
      to: Выкл. (только текст)
    - id: locale.gateway.voice.label_voice_only
      family: locale.gateway.voice
      from: On (voice reply to voice messages)
      to: Вкл. (голосовой ответ на голосовые сообщения)
    - id: locale.gateway.voice.label_all
      family: locale.gateway.voice
      from: TTS (voice reply to all messages)
      to: TTS (голосовой ответ на все сообщения)
    - id: locale.gateway.voice.help
      family: locale.gateway.voice
      from: '{toggle}


        **How /voice works**

        • `/voice on` — voice reply when you send a voice message

        • `/voice tts` — voice reply to *every* message

        • `/voice off` — back to text-only replies

        • `/voice status` — show the current mode

        • `/voice` (no argument) — quick toggle between on and off{channels}'
      to: '{toggle}


        **Как работает /voice**

        • `/voice on` — голосовой ответ, когда вы отправляете голосовое сообщение

        • `/voice tts` — голосовой ответ на *каждое* сообщение

        • `/voice off` — вернуться к ответам только текстом

        • `/voice status` — показать текущий режим

        • `/voice` (без аргумента) — быстрое переключение между вкл и выкл{channels}'
      placeholders:
        toggle: .*?
        channels: .*?
    - id: locale.gateway.voice.help_channels
      family: locale.gateway.voice
      from: '


        **Live voice channels (Discord)**

        • Join a voice channel first, then `/voice channel` — I''ll join, listen, and speak my replies

        • `/voice leave` — disconnect from the voice channel'
      to: '


        **Живые голосовые каналы (Discord)**

        • Сначала зайдите в голосовой канал, затем `/voice channel` — я подключусь, буду слушать и отвечать голосом

        • `/voice leave` — отключиться от голосового канала'
    - id: locale.gateway.yolo.disabled
