      to: hermes chat -q "query" выполняет один неинтерактивный запрос и завершает работу.
    - id: cli_tips.tip_054
      family: cli_tips
      from: hermes chat --max-turns 1000 overrides the default 500-iteration limit per turn.
      to: hermes chat --max-turns 1000 заменяет стандартное ограничение в 500 итераций на ход.
    - id: cli_tips.tip_055
      family: cli_tips
      from: hermes chat --checkpoints enables filesystem snapshots before every destructive file change.
      to: hermes chat --checkpoints включает снимки файловой системы перед каждым потенциально разрушительным изменением файлов.
    - id: cli_tips.tip_056
