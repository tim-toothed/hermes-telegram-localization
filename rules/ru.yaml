      family: cli_tips
      from: MCP servers are configured in config.yaml — both stdio and HTTP transports supported.
      to: Серверы MCP настраиваются в config.yaml — поддерживаются транспорты stdio и HTTP.
    - id: cli_tips.tip_188
      family: cli_tips
      from: 'Per-server tool filtering: tools.include whitelists and tools.exclude blacklists specific tools.'
      to: 'Фильтрация инструментов по серверу: tools.include разрешает указанные инструменты, tools.exclude запрещает.'
    - id: cli_tips.tip_189
      family: cli_tips
      from: MCP servers auto-generate toolsets at runtime — hermes tools can toggle them per platform.
      to: Серверы MCP автоматически создают наборы инструментов во время работы — hermes tools переключает их для каждой платформы.
    - id: cli_tips.tip_190
      family: cli_tips
      from: 'MCP OAuth support: auth: oauth enables browser-based authorization with PKCE.'
      to: 'Поддержка OAuth в MCP: auth: oauth включает авторизацию через браузер с PKCE.'
    - id: cli_tips.tip_191
      family: cli_tips
      from: Checkpoints have zero overhead when no files are modified — enabled by default.
      to: Контрольные точки не создают накладных расходов, если файлы не меняются; они включены по умолчанию.
    - id: cli_tips.tip_192
      family: cli_tips
      from: A pre-rollback snapshot is saved automatically so you can undo the undo.
      to: Перед откатом автоматически сохраняется снимок, чтобы можно было отменить сам откат.
    - id: cli_tips.tip_193
