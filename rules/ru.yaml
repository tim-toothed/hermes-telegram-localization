      from: '💡 First-time tip: I interrupted the current task to answer you. Use `/busy queue` to queue follow-ups, `/busy
        steer` to inject them without interrupting, or `/busy status` to check. This notice will not appear again.'
      to: '💡 Первая подсказка: текущая задача прервана для ответа. `/busy queue` ставит следующие сообщения в очередь, `/busy
