      from: '{value} is already retrying — no resume needed.'
      to: Для {value} уже выполняются повторные попытки — возобновление не требуется.
      placeholders:
        value: .+?
    - id: hardcoded.slash.platform.1593
      family: gateway.slash.platform
      from: ✓ {value} resumed — retrying on next watcher tick.
      to: ✓ Повторные подключения для {value} возобновлены — следующая попытка будет выполнена при очередном проходе наблюдателя.
      placeholders:
        value: .+?
    - id: hardcoded.slash.platform.1595
      family: gateway.slash.platform
      from: "Usage: /platform <list|pause|resume> [name]\n  /platform list — show platform status\n  /platform pause <name>\
        \ — stop retrying a failing platform\n  /platform resume <name> — re-queue a paused platform"
      to: "Использование: /platform <list|pause|resume> [name]\n  /platform list — показать состояние платформ\n  /platform\
        \ pause <name> — прекратить повторные подключения к недоступной платформе\n  /platform resume <name> — вернуть приостановленную\
        \ платформу в очередь"
    - id: hardcoded.slash.refine.2966
      family: gateway.slash.refine
      from: Refine unavailable (no session).
      to: Команда /refine недоступна (нет сессии).
    - id: hardcoded.slash.refine.2968
      family: gateway.slash.refine
      from: Agent is running — wait for the turn to finish, then /refine.
      to: Агент выполняет задачу — дождитесь завершения текущего хода, затем вызовите /refine.
    - id: hardcoded.slash.refine.2977
      family: gateway.slash.refine
      from: Nothing to refine yet — send a message first.
      to: Пока нечего анализировать — сначала отправьте сообщение.
    - id: hardcoded.slash.refine.2981
      family: gateway.slash.refine
      from: Nothing to refine yet — the conversation is empty.
      to: Пока нечего анализировать — диалог пуст.
    - id: hardcoded.slash.refine.2992
      family: gateway.slash.refine
      from: '/refine failed to start: {exc}'
      to: 'Не удалось запустить /refine: {exc}'
      placeholders:
        exc: .*?
    - id: hardcoded.slash.refine.2994
      family: gateway.slash.refine
      from: ⚗ Reviewing this conversation in the background{tail} — any memory/skill updates will be reported when done.
      to: ⚗ Диалог анализируется в фоновом режиме{tail} — о внесённых изменениях в память или навыки будет сообщено после
        завершения.
      placeholders:
        tail: .*?
    - id: hardcoded.slash.save.4664
      family: gateway.slash.save
      from: No stored messages found for this session ({session_id}).
      to: Для этой сессии ({session_id}) не найдено сохранённых сообщений.
      placeholders:
        session_id: .+?
    - id: hardcoded.slash.save.4688
      family: gateway.slash.save
      from: Export complete.
      to: Экспорт завершён.
    - id: hardcoded.slash.save.4689
      family: gateway.slash.save
      from: Platform adapter not found to send the document.
      to: Не найден адаптер платформы для отправки документа.
    - id: hardcoded.slash.save.4692
      family: gateway.slash.save
      from: 'Error exporting session: {e}'
      to: 'Ошибка при экспорте сессии: {e}'
      placeholders:
        e: .*?
    - id: hardcoded.slash.sessions.4961
      family: gateway.slash.sessions
      from: 'Usage: `/sessions search <query>`'
      to: 'Использование: `/sessions search <query>`'
    - id: hardcoded.slash.skills.3847
      family: gateway.slash.skills
      from: Skill write approval is off (skills.write_approval). Enable it with /skills approval on, then review staged writes
        here with /skills pending.
      to: Подтверждение записи навыков отключено (skills.write_approval). Включите его командой /skills approval on, затем
        просмотрите ожидающие записи здесь с помощью /skills pending.
    - id: hardcoded.slash.skills.3865
      family: gateway.slash.skills
      from: 'Unknown /skills subcommand on this platform. Use: pending, approve <id>, reject <id>, diff <id>, approval <on|off>.
        (Search/install are CLI-only.)'
      to: 'Неизвестная подкоманда /skills для этой платформы. Доступны: pending, approve <id>, reject <id>, diff <id>, approval
        <on|off>. (Поиск и установка доступны только через CLI.)'
    - id: hardcoded.slash.subgoal.3011
      family: gateway.slash.subgoal
      from: No active goal. Set one with /goal <text>.
      to: Нет активной цели. Задайте её командой /goal <text>.
    - id: hardcoded.slash.subgoal.3023
      family: gateway.slash.subgoal
      from: 'Usage: /subgoal remove <n>'
      to: 'Использование: /subgoal remove <n>'
    - id: hardcoded.slash.subgoal.3027
      family: gateway.slash.subgoal
      from: '/subgoal remove: <n> must be an integer (1-based index).'
      to: '/subgoal remove: <n> должен быть целым числом (индекс начинается с 1).'
    - id: hardcoded.slash.subgoal.3032
      family: gateway.slash.subgoal
      from: '✓ Removed subgoal {idx}: {removed}'
      to: '✓ Подцель {idx} удалена: {removed}'
      placeholders:
        idx: .+?
        removed: .*?
    - id: hardcoded.slash.subgoal.3041
      family: gateway.slash.subgoal
      from: No subgoals to clear.
      to: Нет подцелей для удаления.
    - id: hardcoded.slash.subgoal.3048
      family: gateway.slash.subgoal
      from: '✓ Added subgoal {idx}: {text}'
      to: '✓ Добавлена подцель {idx}: {text}'
      placeholders:
        idx: .+?
        text: .*?
  hardcoded.hermes.cli.commands.py:
    source_file: hermes_cli/commands.py
    rules:
    - id: telegram.command_menu.agents
      family: telegram.command_menu
      from: Show active agents and running tasks
      to: Показать активных агентов и выполняемые задачи
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.approvals
      family: telegram.command_menu
      from: Show or set the persistent dangerous-command approval mode
      to: Показать или изменить постоянный режим подтверждений
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.approve
      family: telegram.command_menu
      from: Approve a pending dangerous command
      to: Подтвердить ожидающую опасную команду
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.background
      family: telegram.command_menu
      from: Run a prompt in the background
      to: Выполнить запрос в фоне
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.blueprint
      family: telegram.command_menu
      from: Set up an automation from a blueprint template
      to: Настроить автоматизацию по шаблону blueprint
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.branch
      family: telegram.command_menu
      from: Branch the current session (explore a different path)
      to: Создать ветку текущего сеанса
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.bundles
      family: telegram.command_menu
      from: List skill bundles (aliases /<name> for multiple skills)
      to: Показать наборы навыков (алиасы /<name>)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.codex_runtime
      family: telegram.command_menu
      from: Toggle codex app-server runtime for OpenAI/Codex models
      to: Переключить codex app-server для моделей OpenAI/Codex
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.commands
      family: telegram.command_menu
      from: Browse all commands and skills (paginated)
      to: Просмотреть все команды и навыки (по страницам)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.compress
      family: telegram.command_menu
      from: Compress conversation context (add 'here [N]' to keep recent N turns; --preview shows what would happen)
      to: Сжать контекст (`here [N]` сохранит N последних ходов; --preview покажет результат)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.context
      family: telegram.command_menu
      from: Show detailed context window view with usage gauge, category breakdown, compression stats, and throughput
      to: Показать подробную статистику окна контекста
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.curator
      family: telegram.command_menu
      from: Background skill maintenance (status, run, pin, archive, list-archived)
      to: Фоновое обслуживание навыков
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.debug
      family: telegram.command_menu
      from: Upload debug report (system info + logs) and get shareable links
      to: Загрузить диагностический отчёт и получить ссылки
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.deny
      family: telegram.command_menu
      from: Deny a pending dangerous command (optionally with a reason)
      to: Отклонить опасную команду (можно указать причину)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.diff
      family: telegram.command_menu
      from: Show git changes in the working directory
      to: Показать изменения Git в рабочем каталоге
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.egress
      family: telegram.command_menu
      from: Show Docker egress proxy status
      to: Показать состояние Docker egress proxy
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.fast
      family: telegram.command_menu
      from: Toggle fast mode — OpenAI Priority Processing / Anthropic Fast Mode (Normal/Fast)
      to: Переключить быстрый режим OpenAI/Anthropic (Normal/Fast)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.footer
      family: telegram.command_menu
      from: Toggle gateway runtime-metadata footer on final replies
      to: Переключить служебный footer в финальных ответах
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.goal
      family: telegram.command_menu
      from: Set a standing goal Hermes works on across turns until achieved
      to: Задать постоянную цель для Hermes до её достижения
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.heartbeat
      family: telegram.command_menu
      from: Set a recurring prompt that re-enters this session when idle
      to: Задать повторяющийся запрос для свободного сеанса
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.help
      family: telegram.command_menu
      from: Show available commands
      to: Показать доступные команды
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.init
      family: telegram.command_menu
      from: Generate or update AGENTS.md project instructions from a repo scan
      to: Создать или обновить AGENTS.md по репозиторию
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.kanban
      family: telegram.command_menu
      from: Multi-profile collaboration board (tasks, links, comments)
      to: Доска совместной работы профилей
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.learn
      family: telegram.command_menu
      from: Learn a reusable skill from anything you describe (dirs, URLs, this chat, notes)
      to: Создать повторно используемый навык из описания
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.loop
      family: telegram.command_menu
      from: Re-run a prompt on a recurring interval in this session
      to: Повторять запрос с заданным интервалом в этом сеансе
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.memory
      family: telegram.command_menu
      from: Review pending memory writes / toggle the approval gate
      to: Проверить записи памяти и режим их подтверждения
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.moa
      family: telegram.command_menu
      from: Run one prompt through the default Mixture of Agents preset, then restore your model
      to: Выполнить запрос через Mixture of Agents и вернуть исходную модель
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.model
      family: telegram.command_menu
      from: Switch model (session-scoped; --global to persist)
      to: Сменить модель (для сеанса; --global сохраняет выбор)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.new
      family: telegram.command_menu
      from: Start a new session (fresh session ID + history)
      to: Начать новый сеанс (новые ID и история)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.pause
      family: telegram.command_menu
      from: Pause new work globally (emergency stop); '/pause off' resumes
      to: Глобально приостановить новую работу; `/pause off` возобновляет
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.personality
      family: telegram.command_menu
      from: Set a predefined personality
      to: Выбрать готовую личность
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.platform
      family: telegram.command_menu
      from: Pause, resume, or list a failing gateway platform
      to: Приостановить, возобновить или показать проблемную платформу
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.profile
      family: telegram.command_menu
      from: Show active profile name and home directory
      to: Показать активный профиль и его домашний каталог
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.queue
      family: telegram.command_menu
      from: Queue a prompt for the next turn (doesn't interrupt)
      to: Поставить запрос в очередь на следующий ход
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.reasoning
      family: telegram.command_menu
      from: Manage reasoning effort and display
      to: Настроить глубину и отображение рассуждений
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.refine
      family: telegram.command_menu
      from: Review this conversation now and save lessons to memory/skills
      to: Разобрать диалог и сохранить выводы в память или навыки
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.reload_mcp
      family: telegram.command_menu
      from: Reload MCP servers from config
      to: Перезагрузить MCP-серверы из конфигурации
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.reload_skills
      family: telegram.command_menu
      from: Re-scan ~/.hermes/skills/ for newly installed or removed skills
      to: Повторно просканировать ~/.hermes/skills/
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.restart
      family: telegram.command_menu
      from: Gracefully restart the gateway after draining active runs
      to: Перезапустить сервис после завершения активных задач
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.resume
      family: telegram.command_menu
      from: Resume a previously-named session
      to: Возобновить ранее именованный сеанс
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.retry
      family: telegram.command_menu
      from: Retry the last message (resend to agent)
      to: Повторить последнее сообщение агенту
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.rollback
      family: telegram.command_menu
      from: List or restore filesystem checkpoints (restores keep your hand-edits; --all overrides)
      to: Показать или восстановить контрольные точки файловой системы
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.save
      family: telegram.command_menu
      from: Export the current conversation (bare /save shows usage)
      to: Экспортировать текущий диалог (/save без аргументов покажет справку)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.sessions
      family: telegram.command_menu
      from: Browse and resume previous sessions
      to: Просмотреть и возобновить предыдущие сеансы
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.sethome
      family: telegram.command_menu
      from: Set this chat as the home channel
      to: Назначить этот чат домашним каналом
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.start
      family: telegram.command_menu
      from: Acknowledge platform start pings without a reply
      to: Подтвердить запуск платформы без ответа
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.status
      family: telegram.command_menu
      from: Show session, model, token, and context info
      to: Показать сведения о сеансе, модели, токенах и контексте
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.steer
      family: telegram.command_menu
      from: Inject a message after the next tool call without interrupting
      to: Передать сообщение после следующего вызова инструмента
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.stop
      family: telegram.command_menu
      from: Kill all running background processes
      to: Остановить все запущенные фоновые процессы
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.subgoal
      family: telegram.command_menu
      from: Add or manage extra criteria on the active goal
      to: Добавить или изменить критерии активной цели
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.title
      family: telegram.command_menu
      from: Set a title for the current session
      to: Задать название текущего сеанса
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.topic
      family: telegram.command_menu
      from: Enable or inspect Telegram DM topic sessions
      to: Включить или проверить сеансы в темах Telegram DM
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.topup
      family: telegram.command_menu
      from: Show your Nous balance and manage billing on the portal
      to: Показать баланс Nous и открыть управление оплатой
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.undo
      family: telegram.command_menu
      from: Back up N user turns and re-prompt (default 1)
      to: Откатить N ходов пользователя и повторить запрос (по умолчанию 1)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.update
      family: telegram.command_menu
      from: Update Hermes Agent to the latest version
      to: Обновить Hermes Agent до последней версии
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.usage
      family: telegram.command_menu
      from: Show token usage and rate limits; `reset` redeems a banked Codex limit reset
      to: Показать расход токенов и лимиты; `reset` применяет сброс лимита Codex
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.voice
      family: telegram.command_menu
      from: Toggle voice mode
      to: Переключить голосовой режим
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.whoami
      family: telegram.command_menu
      from: Show your slash command access (admin / user)
      to: Показать ваш доступ к slash-командам (admin / user)
      boundaries:
      - telegram.BotCommand.description
    - id: telegram.command_menu.yolo
      family: telegram.command_menu
      from: Toggle YOLO mode (skip all dangerous command approvals)
      to: Переключить YOLO-режим без подтверждений опасных команд
      boundaries:
      - telegram.BotCommand.description
  hardcoded.locales.en.yaml.locales.ru.yaml:
    source_file: locales/en.yaml + locales/ru.yaml
    rules:
    - id: locale.gateway.goal.resumed.current
      family: gateway.goal
      from: '▶ Goal resumed: {goal}

        Continuing now — I''ll take the next step right away.'
      to: '▶ Цель возобновлена: {goal}

        Продолжаю прямо сейчас — немедленно сделаю следующий шаг.'
      placeholders:
        goal: .*?
  hardcoded.plugins.platforms.telegram.adapter.py:
    source_file: plugins/platforms/telegram/adapter.py
    rules:
    - id: hardcoded.telegram.choice-picker-expired
      family: telegram.picker
      from: Picker expired.
      to: Меню выбора устарело.
      boundaries:
      - telegram.CallbackQuery.answer
    - id: hardcoded.telegram.choice-picker-expired-rerun
      family: telegram.picker
      from: Picker expired — run the command again.
      to: Меню выбора устарело — выполните команду ещё раз.
      boundaries:
      - telegram.CallbackQuery.answer
    - id: hardcoded.telegram.choice-picker-invalid-selection
      family: telegram.picker
      from: Invalid selection.
      to: Недопустимый вариант.
      boundaries:
      - telegram.CallbackQuery.answer
    - id: hardcoded.telegram.choice-picker-unauthorized
      family: telegram.picker
      from: ⛔ You are not authorized to change this setting.
      to: ⛔ У вас нет прав для изменения этой настройки.
      boundaries:
      - telegram.CallbackQuery.answer
    - id: hardcoded.telegram.clarify-awaiting-response-state
      family: telegram.edit_state
      from: '❓ {value}


        <i>Awaiting typed response from {user}…</i>'
      to: '❓ {value}


        <i>Ожидается ответ от {user}…</i>'
      placeholders:
        value: .*?
        user: .*?
    - id: hardcoded.telegram.clarify-expired-alert
      family: telegram.callback
      from: ⚠️ This prompt expired — please /retry.
      to: ⚠️ Этот запрос устарел — используйте /retry.
      boundaries:
      - telegram.CallbackQuery.answer
    - id: hardcoded.telegram.clarify-expired-state
      family: telegram.edit_state
      from: '❓ {value}


        <i>⚠️ This question expired or the session reset — please /retry.</i>'
      to: '❓ {value}


        <i>⚠️ Этот вопрос устарел или сессия была сброшена — используйте /retry.</i>'
      placeholders:
        value: .*?
    - id: hardcoded.telegram.clarify-invalid-choice
      family: telegram.callback
      from: Invalid choice.
      to: Недопустимый вариант.
      boundaries:
      - telegram.CallbackQuery.answer
