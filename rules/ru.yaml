    - id: cli_tips.tip_126
      family: cli_tips
      from: 'The terminal tool supports 6 backends: local, Docker, SSH, Modal, Daytona, and Singularity.'
      to: 'Инструмент terminal поддерживает 6 сред выполнения: local, Docker, SSH, Modal, Daytona и Singularity.'
    - id: cli_tips.tip_127
      family: cli_tips
      from: Each profile gets its own config, API keys, memory, sessions, skills, and cron jobs.
