      from: Context files (.hermes.md, AGENTS.md) are security-scanned for prompt injection before loading.
      to: Файлы контекста (.hermes.md, AGENTS.md) перед загрузкой проверяются на внедрение инструкций.
    - id: cli_tips.tip_173
