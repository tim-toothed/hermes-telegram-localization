    - id: locale.gateway.reload_mcp.always_followup
      family: locale.gateway.reload_mcp
      from: 'ℹ️ Future `/reload-mcp` calls will run without confirmation. Re-enable via `approvals.mcp_reload_confirm: true`
        in config.yaml.'
      to: 'ℹ️ Будущие вызовы `/reload-mcp` будут выполняться без подтверждения. Снова включить можно через `approvals.mcp_reload_confirm:
        true` в config.yaml.'
    - id: locale.gateway.reload_mcp.confirm_prompt
      family: locale.gateway.reload_mcp
      from: '⚠️ **Confirm /reload-mcp**


        Reloading MCP servers rebuilds the tool set for this session and **invalidates the provider prompt cache** — the next
        message will re-send full input tokens.  On long-context or high-reasoning models this can be expensive.


        Choose:

        • **Approve Once** — reload now

        • **Always Approve** — reload now and silence this prompt permanently

        • **Cancel** — leave MCP tools unchanged


        _Text fallback: reply `/approve`, `/always`, or `/cancel`._'
      to: '⚠️ **Подтверждение /reload-mcp**


        Перезагрузка MCP-серверов перестраивает набор инструментов для этого сеанса и **сбрасывает кеш промпта провайдера**
        — следующее сообщение повторно отправит все входные токены. На моделях с длинным контекстом или высоким уровнем рассуждений
        это может быть дорого.


        Выберите:

        • **Одобрить один раз** — перезагрузить сейчас

        • **Всегда одобрять** — перезагрузить и навсегда отключить этот запрос

        • **Отменить** — оставить MCP-инструменты без изменений


        _Текстовая альтернатива: ответьте `/approve`, `/always` или `/cancel`._'
