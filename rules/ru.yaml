# Generated from the factual DESKTOP-2 en/ru catalogs.
# Rules are grouped by the Hermes source module that emits them.
version: 1
locale: ru
groups:
  agent.account.usage.py:
    source_file: agent/account_usage.py
    rules:
    - id: account_usage.label_api_key_quota
      family: account_usage
      from: API key quota
      to: Квота API-ключа
    - id: account_usage.label_subscription
      family: account_usage
      from: Subscription
      to: Подписка
    - id: account_usage.provider
      family: account_usage
      from: 'Provider: {provider}'
      to: 'Провайдер: {provider}'
      placeholders:
        provider: .+?
    - id: account_usage.provider_plan
      family: account_usage
      from: 'Provider: {provider} ({plan})'
      to: 'Провайдер: {provider} ({plan})'
      placeholders:
        provider: .+?
        plan: .+?
    - id: account_usage.reset_days_hours
      family: account_usage
      from: in {days}d {hours}h ({timestamp})
      to: через {days} д {hours} ч ({timestamp})
      placeholders:
        days: .+?
        hours: .+?
        timestamp: .+?
    - id: account_usage.reset_hours_minutes
      family: account_usage
      from: in {hours}h {minutes}m ({timestamp})
      to: через {hours} ч {minutes} мин ({timestamp})
      placeholders:
        hours: .+?
        minutes: '[0-9][0-9.,]*'
        timestamp: .+?
    - id: account_usage.reset_minutes
      family: account_usage
      from: in {minutes}m ({timestamp})
      to: через {minutes} мин ({timestamp})
      placeholders:
        minutes: '[0-9][0-9.,]*'
        timestamp: .+?
    - id: account_usage.reset_now
      family: account_usage
      from: now ({timestamp})
      to: сейчас ({timestamp})
      placeholders:
        timestamp: .+?
    - id: account_usage.title_account_limits
      family: account_usage
      from: Account limits
      to: Ограничения аккаунта
    - id: account_usage.title_nous_credits
      family: account_usage
      from: Nous credits
      to: Кредиты Nous
    - id: account_usage.unavailable
      family: account_usage
      from: 'Unavailable: {reason}'
      to: 'Недоступно: {reason}'
      placeholders:
        reason: .+?
    - id: account_usage.window_unavailable
      family: account_usage
      from: '{label}: unavailable'
      to: '{label}: недоступно'
      placeholders:
        label: .+?
    - id: account_usage.window_usage
      family: account_usage
      from: '{label}: {remaining}% remaining ({used}% used)'
      to: '{label}: осталось {remaining}% (использовано {used}%)'
      placeholders:
        label: .+?
        remaining: '[0-9][0-9.,]*'
        used: '[0-9][0-9.,]*'
  agent.chat.completion.helpers.py:
    source_file: agent/chat_completion_helpers.py
    rules:
    - id: provider_progress.aborting_call
      family: provider_progress
      from: Aborting call.
      to: Останавливаю запрос.
    - id: provider_progress.auto_reconnect
      family: provider_progress
      from: ; auto-reconnect at {seconds}s
      to: ; автоматическое переподключение после {seconds} с ожидания
      placeholders:
        seconds: '[0-9][0-9.,]*'
    - id: provider_progress.bedrock_no_events
      family: provider_progress
      from: '⚠️ No events from Bedrock for {seconds}s (model: {model}). Aborting...'
      to: '⚠️ Bedrock не отвечает {seconds} с (модель: {model}). Останавливаю запрос…'
      placeholders:
        seconds: '[0-9][0-9.,]*'
        model: .+?
    - id: provider_progress.codex_no_events
      family: provider_progress
      from: '⚠️ Codex stream sent no events for {seconds}s after first byte (model: {model}). Reconnecting.'
      to: '⚠️ Поток Codex не передаёт данные {seconds} с после начала ответа (модель: {model}). Переподключаюсь.'
      placeholders:
        seconds: '[0-9][0-9.,]*'
        model: .+?
    - id: provider_progress.fallback_switched
      family: provider_progress
      from: '🔄 Switched to fallback model: {old_model} via {old_provider} → {new_model} via {new_provider}'
      to: '🔄 Переключился на резервную модель: {old_model} через {old_provider} → {new_model} через {new_provider}'
      placeholders:
        old_model: .+?
        old_provider: .+?
        new_model: .+?
        new_provider: .+?
    - id: provider_progress.no_first_byte
      family: provider_progress
      from: '⚠️ No first byte from provider in {seconds}s (codex stream, model: {model}). Reconnecting.{hint_suffix}'
      to: '⚠️ Провайдер не начал передачу ответа за {seconds} с (поток Codex, модель: {model}). Переподключаюсь.{hint_suffix}'
      placeholders:
        seconds: '[0-9][0-9.,]*'
        model: .+?
        hint_suffix: .+?
    - id: provider_progress.no_output_reconnecting
      family: provider_progress
      from: ⚠ no output from provider for {seconds}s — reconnecting...
      to: ⚠ Провайдер не передаёт данные {seconds} с — переподключаюсь…
      placeholders:
        seconds: '[0-9][0-9.,]*'
    - id: provider_progress.no_response_reconnecting
      family: provider_progress
      from: ⚠ no response from provider in {seconds}s — reconnecting...
      to: ⚠ Провайдер не отвечает {seconds} с — переподключаюсь…
      placeholders:
        seconds: '[0-9][0-9.,]*'
    - id: provider_progress.nonstream_no_response
      family: provider_progress
      from: '⚠️ No response from provider for {seconds}s (non-streaming, model: {model}). {action}'
      to: '⚠️ Провайдер не отвечает уже {seconds} с (без потока, модель: {model}). {action}'
      placeholders:
        seconds: '[0-9][0-9.,]*'
        model: .+?
        action: .+?
    - id: provider_progress.primary_fallback
      family: provider_progress
      from: '🔄 Primary model failed — switching to fallback: {model} via {provider}'
      to: '🔄 Основная модель не смогла выполнить запрос — переключаюсь на резервную: {model} через {provider}'
      placeholders:
        model: .+?
        provider: .+?
    - id: provider_progress.stream_no_response
      family: provider_progress
      from: '⚠️ No response from provider for {seconds}s (model: {model}, context: ~{tokens} tokens). Reconnecting...'
      to: '⚠️ Провайдер не отвечает {seconds} с (модель: {model}, контекст: около {tokens} токенов). Переподключаюсь…'
      placeholders:
        seconds: '[0-9][0-9.,]*'
        model: .+?
        tokens: '[0-9][0-9.,]*'
    - id: provider_progress.waiting_no_output
      family: provider_progress
      from: ⏳ waiting on {model} — {seconds}s with no output yet (provider may be slow or overloaded, or the model is thinking{recovery})
      to: '⏳ Жду ответ модели {model}: данных нет {seconds} с. Провайдер может отвечать медленно, быть перегружен или модель
        ещё формирует ответ{recovery}.'
      placeholders:
        model: .+?
        seconds: '[0-9][0-9.,]*'
        recovery: .*?
    - id: provider_progress.waiting_no_response
      family: provider_progress
      from: ⏳ waiting on {model} — {seconds}s with no response yet (provider may be slow or overloaded{recovery})
      to: '⏳ Жду ответ модели {model}: данных нет {seconds} с. Провайдер может отвечать медленно или быть перегружен{recovery}.'
      placeholders:
        model: .+?
        seconds: '[0-9][0-9.,]*'
        recovery: .*?
  agent.display.py:
    source_file: agent/display.py
    rules:
    - id: tool_progress.live_status
      family: tool_progress
      from: is {action}
      to: '{action}'
      placeholders:
        action: .+?
    - id: tool_progress.verbs.browser_click
      family: tool_progress
      from: Clicking
      to: Нажимаю
    - id: tool_progress.verbs.browser_navigate
      family: tool_progress
      from: Browsing
      to: Открываю страницу
    - id: tool_progress.verbs.cronjob
      family: tool_progress
      from: Scheduling
      to: Управляю расписанием
    - id: tool_progress.verbs.delegate_task
      family: tool_progress
      from: Delegating
      to: Передаю задачу агенту
    - id: tool_progress.verbs.execute_code
      family: tool_progress
      from: Running code
      to: Выполняю код
    - id: tool_progress.verbs.image_generate
      family: tool_progress
      from: Generating image
      to: Создаю изображение
    - id: tool_progress.verbs.memory
      family: tool_progress
      from: Updating memory
      to: Обновляю память
    - id: tool_progress.verbs.search_files
      family: tool_progress
      from: Searching files
      to: Ищу в файлах
    - id: tool_progress.verbs.session_search
      family: tool_progress
      from: Searching past sessions
      to: Ищу в истории диалогов
    - id: tool_progress.verbs.skill_manage
      family: tool_progress
      from: Updating skill
      to: Обновляю навык
    - id: tool_progress.verbs.skill_view
      family: tool_progress
      from: Reading skill
      to: Изучаю навык
    - id: tool_progress.verbs.skills_list
      family: tool_progress
      from: Listing skills
      to: Получаю список навыков
    - id: tool_progress.verbs.text_to_speech
      family: tool_progress
      from: Generating speech
      to: Озвучиваю текст
    - id: tool_progress.verbs.todo
      family: tool_progress
      from: Updating tasks
      to: Обновляю список задач
    - id: tool_progress.verbs.video_generate
      family: tool_progress
      from: Generating video
      to: Создаю видео
    - id: tool_progress.verbs.vision_analyze
      family: tool_progress
      from: Looking at the image
      to: Анализирую изображение
    - id: tool_progress.verbs.web_search
      family: tool_progress
      from: Searching the web
      to: Ищу в интернете
  agent.onboarding.py:
    source_file: agent/onboarding.py
    rules:
    - id: runtime_status.hint_tool_progress
      family: runtime_status
      from: '💡 First-time tip: this tool took a while, so progress is shown step by step. If this is noisy, use `/verbose`
        to cycle modes (all → new → off). This notice will not appear again.'
      to: '💡 Первая подсказка: инструмент выполняется долго, поэтому прогресс показывается по шагам. Если сообщений слишком
        много, `/verbose` переключает режимы (all → new → off). Подсказка больше не появится.'
  cron.scheduler.py:
    source_file: cron/scheduler.py
    rules:
    - id: runtime_warning.cron_blocked_config
      family: runtime_warning
      from: '⛔ Cron ''{job_name}'' was blocked by configuration validation; no LLM call was made: {error} This alert is sent
        once. The job remains blocked until the configuration is fixed.'
      to: '⛔ Задача Cron «{job_name}» заблокирована проверкой конфигурации; модель не запускалась: {error} Это уведомление
        отправляется один раз. Задача останется заблокированной до исправления конфигурации.'
      placeholders:
        job_name: .+?
        error: .+?
    - id: runtime_warning.cron_drift_consumed
      family: runtime_warning
      from: This finite one-shot job is consumed; create a new one-shot job for a future time with an explicit provider and
        model.
      to: Эта одноразовая задача уже израсходована; создайте новую на будущее время и явно укажите провайдера и модель.
    - id: runtime_warning.cron_drift_pin
      family: runtime_warning
      from: 'Pin the job explicitly on the Hermes host: `{command}`.'
      to: 'Зафиксируйте параметры задачи на хосте Hermes: `{command}`.'
      placeholders:
        command: .+?
    - id: runtime_warning.cron_drift_prevented
      family: runtime_warning
      from: ⚠️ Cron '{job_name}' was skipped before inference to prevent unintended spend. {remediation}
      to: ⚠️ Задача Cron «{job_name}» пропущена до обращения к модели, чтобы избежать непредвиденных расходов. {remediation}
      placeholders:
        job_name: .+?
        remediation: .+?
    - id: runtime_warning.cron_drift_skipped
      family: runtime_warning
      from: '⚠️ Cron ''{job_name}'' was skipped: {error}'
      to: '⚠️ Задача Cron «{job_name}» пропущена: {error}'
      placeholders:
        job_name: .+?
        error: .+?
    - id: runtime_warning.cron_fallback_exhausted
      family: runtime_warning
      from: The fallback chain was exhausted or unavailable.
      to: Цепочка резервных провайдеров исчерпана или недоступна.
    - id: runtime_warning.cron_generic
      family: runtime_warning
      from: '⚠️ Cron ''{job_name}'' failed: {error}'
      to: '⚠️ Задача Cron «{job_name}» завершилась ошибкой: {error}'
      placeholders:
        job_name: .+?
        error: .+?
    - id: runtime_warning.cron_missing_skills
      family: runtime_warning
      from: '⚠️ Skills were not found and were skipped: {skills}'
      to: '⚠️ Скиллы не найдены и пропущены: {skills}'
      placeholders:
        skills: .+?
    - id: runtime_warning.cron_monitor_failed
      family: runtime_warning
      from: '⚠ Cron monitor ''{job_name}'': source check failed


        {error}


        Time: {time}'
      to: '⚠ Cron monitor «{job_name}»: ошибка проверки источника


        {error}


        Время: {time}'
      placeholders:
        job_name: .+?
        error: .+?
        time: .+?
    - id: runtime_warning.cron_no_fallback
      family: runtime_warning
      from: No fallback chain is configured. Add one with `hermes fallback add` or set `cron.model` and `cron.model_provider`
        in `config.yaml`.
      to: Цепочка резервных провайдеров не настроена. Добавьте её командой `hermes fallback add` или задайте `cron.model`
        и `cron.model_provider` в `config.yaml`.
    - id: runtime_warning.cron_provider_auth
      family: runtime_warning
      from: '⚠️ Cron ''{job_name}'' failed: provider authentication was rejected. Check OAuth/credentials and `/usage`. Full
        details were saved in the Cron output.'
      to: '⚠️ Задача Cron «{job_name}» завершилась ошибкой: провайдер отклонил авторизацию. Проверьте OAuth/credentials и
        `/usage`. Подробности сохранены в выводе Cron.'
      placeholders:
        job_name: .+?
    - id: runtime_warning.cron_provider_limit
      family: runtime_warning
      from: '⚠️ Cron ''{job_name}'' failed: provider {reason}. {fallback} Full details were saved in the Cron output.'
      to: '⚠️ Задача Cron «{job_name}» завершилась ошибкой: провайдер сообщил про {reason}. {fallback} Подробности сохранены
        в выводе Cron.'
      placeholders:
        job_name: .+?
        reason: .+?
        fallback: .+?
    - id: runtime_warning.cron_provider_timeout
      family: runtime_warning
      from: '⚠️ Cron ''{job_name}'' failed: the provider timed out. {fallback} Full details were saved in the Cron output.'
      to: '⚠️ Задача Cron «{job_name}» завершилась ошибкой: провайдер не ответил вовремя. {fallback} Подробности сохранены
        в выводе Cron.'
      placeholders:
        job_name: .+?
        fallback: .+?
    - id: runtime_warning.cron_reason_quota
      family: runtime_warning
      from: quota limit
      to: лимит квоты
    - id: runtime_warning.cron_reason_rate
      family: runtime_warning
      from: request rate limit
      to: временное ограничение частоты запросов
    - id: runtime_warning.cron_reason_weekly
      family: runtime_warning
      from: weekly usage limit
      to: недельный лимит использования
    - id: runtime_warning.cron_script_timeout
      family: runtime_warning
      from: '⚠️ Cron ''{job_name}'' failed: the script timed out. No model was invoked. Full details were saved in the Cron
        output.'
      to: '⚠️ Задача Cron «{job_name}» завершилась ошибкой: превышено время выполнения скрипта. Модель не запускалась. Подробности
        сохранены в выводе Cron.'
      placeholders:
        job_name: .+?
    - id: runtime_warning.cron_stalled
      family: runtime_warning
      from: '⚠️ Cron ''{job_name}'' failed: the job itself stalled; no tool/API activity occurred during the configured inactivity
        window. This is not a provider or fallback-chain issue. Check what the job was doing when it stopped. Full details
        were saved in the Cron output.'
      to: '⚠️ Задача Cron «{job_name}» зависла: в течение настроенного интервала не было активности инструментов/API. Это
        не ошибка провайдера или резервной цепочки. Проверьте, на какой операции остановилась задача. Подробности сохранены
        в выводе Cron.'
      placeholders:
        job_name: .+?
    - id: runtime_warning.cron_watchdog_failed
      family: runtime_warning
      from: '⚠ Cron watchdog ''{job_name}'': script execution failed


        {error}


        Time: {time}'
      to: '⚠ Cron watchdog «{job_name}»: ошибка выполнения скрипта


        {error}


        Время: {time}'
      placeholders:
        job_name: .+?
        error: .+?
        time: .+?
    - id: runtime_warning.cron_workdir_lock
      family: runtime_warning
      from: '⚠️ Cron ''{job_name}'' failed: the scheduler working-directory lock could not be acquired because another job
        held it too long. This is not a provider or fallback-chain issue. Stagger the schedules or remove the holder''s `workdir`.
        Full details were saved in the Cron output.'
      to: '⚠️ Задача Cron «{job_name}» завершилась ошибкой: не удалось получить блокировку рабочего каталога, потому что другая
        задача удерживала её слишком долго. Это не ошибка провайдера или резервной цепочки. Разнесите расписания или уберите
        `workdir` у удерживающей задачи. Подробности сохранены в выводе Cron.'
      placeholders:
        job_name: .+?
  gateway.platforms.base.py:
    source_file: gateway/platforms/base.py
    rules:
    - id: runtime_warning.delivery_audio
      family: runtime_warning
      from: ⚠️ Couldn't deliver the audio attachment.
      to: ⚠️ Не удалось доставить аудиофайл.
    - id: runtime_warning.delivery_file
      family: runtime_warning
      from: ⚠️ Couldn't deliver the file attachment.
      to: ⚠️ Не удалось доставить файл.
    - id: runtime_warning.delivery_file_named
      family: runtime_warning
      from: ⚠️ Couldn't deliver the file attachment ({file_name}).
      to: ⚠️ Не удалось доставить файл ({file_name}).
      placeholders:
        file_name: .+?
    - id: runtime_warning.delivery_image
      family: runtime_warning
      from: ⚠️ Couldn't deliver the image attachment.
      to: ⚠️ Не удалось доставить изображение.
    - id: runtime_warning.delivery_message
      family: runtime_warning
      from: ⚠️ Message delivery failed after multiple attempts. Please try again — your request was processed but the response
        could not be sent.
      to: ⚠️ Не удалось доставить ответ после нескольких попыток. Запрос обработан, но ответ не был отправлен. Попробуйте
        ещё раз.
    - id: runtime_warning.delivery_video
      family: runtime_warning
      from: ⚠️ Couldn't deliver the video attachment.
      to: ⚠️ Не удалось доставить видеофайл.
  gateway.run.py:
    source_file: gateway/run.py
    rules:
    - id: gateway.provider_error.auth
      family: gateway
      from: '⚠️ **Could not get a response from the provider.** Possible causes: a temporary failure, an expired authorization
        session, or an exhausted subscription limit. Check `/usage` and retry. If the error persists, refresh OAuth/credentials.
        Technical details were saved in the Hermes service logs.'
      to: '⚠️ **Не удалось получить ответ от провайдера.** Возможные причины: временный сбой, истёкшая авторизация или исчерпан
        лимит подписки. Проверьте `/usage` и повторите запрос. Если ошибка сохраняется, обновите OAuth/credentials. Технические
        подробности сохранены в журналах сервиса Hermes.'
    - id: gateway.provider_error.billing
      family: gateway
      from: '⚠️ **The provider limit is exhausted.** Check `/usage`: if the limit is temporary, wait for it to reset; if credits
        are depleted, top up the balance. The request was not completed.'
      to: '⚠️ **Лимит провайдера исчерпан.** Проверьте `/usage`: если лимит временный — дождитесь его сброса; если закончились
        кредиты — пополните баланс. Запрос не выполнен.'
    - id: gateway.provider_error.billing_unverified
      family: gateway
      from: ⚠️ **The provider did not complete the request.** The extra-usage limit may be exhausted, or the request may have
        been rejected by the provider filter. Check `/usage` and try rephrasing the request.
      to: ⚠️ **Провайдер не выполнил запрос.** Возможно, исчерпан дополнительный лимит либо запрос отклонён фильтром провайдера.
        Проверьте `/usage` и попробуйте переформулировать запрос.
    - id: gateway.provider_error.connection
      family: gateway
      from: ⚠️ **The model server is not responding.** Check the configured endpoint or try again later. The request was not
        completed.
      to: ⚠️ **Сервер модели не отвечает.** Проверьте настроенный endpoint или попробуйте позже. Запрос не выполнен.
    - id: gateway.provider_error.empty_after_tools
      family: gateway
      from: ⚠️ **The model returned no answer after processing tool results.** Try the request again or switch models with
        `/model`.
      to: ⚠️ **Модель не вернула ответ после обработки результатов инструментов.** Повторите запрос или переключите модель
        через `/model`.
    - id: gateway.provider_error.failed_after_retries
      family: gateway
      from: ⚠️ **The provider did not respond after repeated attempts.** Try again later or switch models with `/model`. Technical
        details were saved in the Hermes service logs.
      to: ⚠️ **Провайдер не ответил после повторных попыток.** Попробуйте позже или переключите модель через `/model`. Технические
        подробности сохранены в журналах сервиса Hermes.
    - id: gateway.provider_error.policy
