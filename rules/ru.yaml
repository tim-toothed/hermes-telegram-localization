      to: hermes profile export coder -o backup.tar.gz создаёт переносимый архив профиля.
    - id: cli_tips.tip_130
      family: cli_tips
      from: If two profiles accidentally share a bot token, the second gateway is blocked with a clear error.
      to: Если два профиля случайно используют один токен бота, запуск второго сервиса Hermes блокируется с понятным сообщением об ошибке.
