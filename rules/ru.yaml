    - id: runtime_status.hint_queue
      family: runtime_status
      from: '💡 First-time tip: I queued your message instead of interrupting. Use `/busy interrupt` to make new messages stop
        the current task immediately, or `/busy status` to check. This notice will not appear again.'
      to: '💡 Первая подсказка: сообщение поставлено в очередь без прерывания работы. `/busy interrupt` переключает новые сообщения
        в режим немедленного прерывания, `/busy status` показывает режим. Подсказка больше не появится.'
    - id: runtime_status.hint_redirect
      family: runtime_status
      from: '💡 First-time tip: I redirected the current run using your message. Completed work remains in context, and `/stop`
