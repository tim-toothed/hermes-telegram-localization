      to: Контрольные точки используют отдельные репозитории в ~/.hermes/checkpoints/ — .git вашего проекта не затрагивается.
    - id: cli_tips.tip_195
      family: cli_tips
      from: batch_runner.py processes hundreds of prompts in parallel for training data generation.
      to: batch_runner.py параллельно обрабатывает сотни запросов для генерации обучающих данных.
    - id: cli_tips.tip_196
      family: cli_tips
      from: hermes chat -Q enables quiet mode for programmatic use — suppresses banner and spinner.
      to: hermes chat -Q включает тихий режим для программного использования — скрывает баннер и индикатор ожидания.
    - id: cli_tips.tip_197
      family: cli_tips
      from: Trajectory saving (--save-trajectories) captures full tool-use traces for model training.
      to: Сохранение траекторий (--save-trajectories) записывает полные последовательности использования инструментов для обучения моделей.
    - id: cli_tips.tip_198
      family: cli_tips
      from: 'Three plugin types: general (tools/hooks), memory providers, and context engines.'
      to: 'Три типа плагинов: общие (инструменты и обработчики), провайдеры памяти и движки контекста.'
    - id: cli_tips.tip_199
      family: cli_tips
      from: hermes plugins install owner/repo installs plugins directly from GitHub.
      to: hermes plugins install owner/repo устанавливает плагины прямо из GitHub.
    - id: cli_tips.tip_200
      family: cli_tips
      from: '8 external memory providers available: Honcho, OpenViking, Mem0, Hindsight, and more.'
      to: 'Доступны 8 внешних провайдеров памяти: Honcho, OpenViking, Mem0, Hindsight и другие.'
    - id: cli_tips.tip_201
      family: cli_tips
      from: Plugin hooks include pre/post_tool_call, pre/post_llm_call, and transform_terminal_output for output canonicalization.
      to: Обработчики плагинов включают pre/post_tool_call, pre/post_llm_call и transform_terminal_output для приведения вывода к единому виду.
    - id: cli_tips.tip_202
      family: cli_tips
      from: Prompt caching (Anthropic) reduces costs by reusing cached system prompt prefixes.
      to: Кеширование промптов (Anthropic) снижает стоимость за счёт повторного использования кешированных префиксов системного промпта.
    - id: cli_tips.tip_203
      family: cli_tips
      from: The agent auto-generates session titles in a background thread — zero latency impact.
      to: Агент автоматически создаёт названия сеансов в фоновом потоке — без влияния на задержку ответа.
    - id: cli_tips.tip_204
      family: cli_tips
      from: Smart model routing can auto-route simple queries to a cheaper model.
      to: Умная маршрутизация моделей может автоматически направлять простые запросы более дешёвой модели.
    - id: cli_tips.tip_205
      family: cli_tips
      from: 'Slash commands support prefix matching: /h resolves to /help, /mod to /model.'
      to: 'Команды с косой чертой поддерживают сокращения: /h распознаётся как /help, /mod — как /model.'
    - id: cli_tips.tip_206
      family: cli_tips
      from: Dragging a file path into the terminal auto-attaches images or sends as context.
      to: Перетаскивание пути файла в терминал автоматически прикрепляет изображение или отправляет файл как контекст.
    - id: cli_tips.tip_207
      family: cli_tips
      from: .worktreeinclude in your repo root lists gitignored files to copy into worktrees.
      to: .worktreeinclude в корне репозитория перечисляет игнорируемые git файлы для копирования в рабочие деревья.
    - id: cli_tips.tip_208
      family: cli_tips
      from: hermes acp runs Hermes as an ACP server for VS Code, Zed, and JetBrains integration.
      to: hermes acp запускает Hermes как сервер ACP для интеграции с VS Code, Zed и JetBrains.
    - id: cli_tips.tip_209
      family: cli_tips
      from: 'Custom providers: save named endpoints in config.yaml under custom_providers.'
      to: 'Собственные провайдеры: сохраняйте именованные конечные точки в config.yaml в разделе custom_providers.'
    - id: cli_tips.tip_210
      family: cli_tips
      from: HERMES_EPHEMERAL_SYSTEM_PROMPT injects a system prompt that's never persisted to history.
      to: HERMES_EPHEMERAL_SYSTEM_PROMPT добавляет системный промпт, который никогда не сохраняется в историю.
    - id: cli_tips.tip_211
      family: cli_tips
      from: credential_pool_strategies supports fill_first, round_robin, least_used, and random rotation.
      to: credential_pool_strategies поддерживает стратегии ротации fill_first, round_robin, least_used и random.
    - id: cli_tips.tip_212
      family: cli_tips
      from: hermes auth add nous or hermes auth add openai-codex sets up OAuth-based providers.
      to: hermes auth add nous или hermes auth add openai-codex настраивает провайдеров с авторизацией OAuth.
    - id: cli_tips.tip_213
      family: cli_tips
      from: The API server supports both Chat Completions and Responses API with server-side state.
      to: Сервер API поддерживает Chat Completions и Responses API с хранением состояния на сервере.
    - id: cli_tips.tip_214
      family: cli_tips
      from: 'tool_preview_length: 0 in config shows full file paths in the spinner''s activity feed.'
      to: 'tool_preview_length: 0 в конфигурации показывает полные пути файлов в ленте активности индикатора ожидания.'
    - id: cli_tips.tip_215
      family: cli_tips
      from: hermes status --deep runs deeper diagnostic checks across all components.
      to: hermes status --deep выполняет углублённую диагностику всех компонентов.
    - id: cli_tips.tip_216
      family: cli_tips
      from: Cron jobs can attach a Python script (--script) whose stdout is injected into the prompt as context.
      to: К заданиям Cron можно прикрепить скрипт Python (--script), чей stdout добавляется в запрос как контекст.
    - id: cli_tips.tip_217
      family: cli_tips
      from: Cron scripts live in ~/.hermes/scripts/ and run before the agent — perfect for data collection pipelines.
      to: Скрипты Cron находятся в ~/.hermes/scripts/ и выполняются перед агентом — удобно для конвейеров сбора данных.
    - id: cli_tips.tip_218
      family: cli_tips
      from: prefill_messages_file in config.yaml injects few-shot examples into every API call, never saved to history.
      to: prefill_messages_file в config.yaml добавляет примеры в каждый вызов API, не сохраняя их в историю.
    - id: cli_tips.tip_219
      family: cli_tips
      from: SOUL.md completely replaces the agent's default identity — rewrite it to make Hermes your own.
      to: SOUL.md полностью заменяет идентичность агента по умолчанию — перепишите его, чтобы настроить Hermes под себя.
    - id: cli_tips.tip_220
      family: cli_tips
      from: SOUL.md is auto-seeded with a default personality on first run. Edit it to customize.
      to: При первом запуске SOUL.md автоматически заполняется характером по умолчанию. Отредактируйте его под себя.
    - id: cli_tips.tip_221
      family: cli_tips
      from: /compress <focus topic> allocates 60-70% of the summary budget to your topic and aggressively trims the rest.
      to: /compress <focus topic> выделяет 60-70% объёма резюме вашей теме и существенно сокращает остальное.
    - id: cli_tips.tip_222
      family: cli_tips
      from: On second+ compression, the compressor updates the previous summary instead of starting from scratch.
      to: При втором и последующих сжатиях обновляется предыдущее резюме, а не создаётся новое с нуля.
    - id: cli_tips.tip_223
      family: cli_tips
      from: Before a gateway session reset, Hermes auto-flushes important facts to memory in the background.
      to: Перед сбросом сеанса сервиса Hermes важные факты автоматически сохраняются в память в фоне.
    - id: cli_tips.tip_224
      family: cli_tips
      from: 'network.force_ipv4: true in config.yaml fixes hangs on servers with broken IPv6 — monkey-patches socket.'
      to: 'network.force_ipv4: true в config.yaml устраняет зависания на серверах с неработающим IPv6 — подменяет поведение socket во время выполнения.'
    - id: cli_tips.tip_225
      family: cli_tips
      from: 'The terminal tool annotates common exit codes: grep returning 1 = ''No matches found (not an error)''.'
      to: 'Инструмент terminal поясняет распространённые коды завершения: код 1 у grep означает «Совпадений нет (это не ошибка)».'
    - id: cli_tips.tip_226
      family: cli_tips
      from: Failed foreground terminal commands auto-retry up to 3 times with exponential backoff (2s, 4s, 8s).
      to: Неудачные команды терминала переднего плана автоматически повторяются до 3 раз с экспоненциальной задержкой (2, 4, 8 секунд).
    - id: cli_tips.tip_227
      family: cli_tips
      from: Bare sudo commands are auto-rewritten to pipe SUDO_PASSWORD from .env — no interactive prompt needed.
      to: Обычные команды sudo автоматически переписываются для передачи SUDO_PASSWORD из .env через конвейер — интерактивный запрос не нужен.
    - id: cli_tips.tip_228
      family: cli_tips
      from: 'execute_code has built-in helpers: json_parse() for tolerant parsing, shell_quote(), and retry() with backoff.'
      to: 'execute_code содержит встроенные помощники: json_parse() для устойчивого разбора, shell_quote() и retry() с увеличением задержки.'
    - id: cli_tips.tip_229
      family: cli_tips
      from: execute_code's 7 sandbox tools (web_search, terminal, read/write/search/patch) use RPC — never enter context.
      to: 7 инструментов песочницы execute_code (web_search, terminal, read/write/search/patch) используют RPC — их результаты не попадают в контекст.
    - id: cli_tips.tip_230
      family: cli_tips
      from: Reading the same file region 3+ times triggers a warning. At 4+, it's hard-blocked to prevent loops.
      to: Чтение одного участка файла 3 и более раз вызывает предупреждение. С 4-го раза чтение блокируется для предотвращения циклов.
    - id: cli_tips.tip_231
      family: cli_tips
      from: write_file and patch detect if a file was externally modified since the last read and warn about staleness.
      to: write_file и patch обнаруживают внешние изменения файла после последнего чтения и предупреждают об устаревшем содержимом.
    - id: cli_tips.tip_232
      family: cli_tips
      from: V4A patch format supports Add File, Delete File, and Move File directives — not just Update.
      to: Формат патчей V4A поддерживает директивы Add File, Delete File и Move File, а не только Update.
    - id: cli_tips.tip_233
      family: cli_tips
      from: MCP servers can request LLM completions back via sampling — the agent becomes a tool for the server.
      to: Серверы MCP могут запрашивать генерацию LLM через sampling — агент становится инструментом для сервера.
    - id: cli_tips.tip_234
      family: cli_tips
      from: MCP servers send notifications/tools/list_changed to trigger automatic tool re-registration without restart.
      to: Серверы MCP отправляют notifications/tools/list_changed для автоматической перерегистрации инструментов без перезапуска.
    - id: cli_tips.tip_235
      family: cli_tips
      from: 'delegate_task with acp_command: ''claude'' spawns Claude Code as a child agent from any platform.'
      to: 'delegate_task с acp_command: ''claude'' запускает Claude Code как дочернего агента с любой платформы.'
    - id: cli_tips.tip_236
      family: cli_tips
      from: Delegation has a heartbeat thread — child activity propagates to the parent, preventing gateway timeouts.
      to: У делегирования есть поток уведомлений об активности — работа дочернего агента передаётся родительскому, предотвращая тайм-ауты сервиса Hermes.
    - id: cli_tips.tip_237
      family: cli_tips
      from: When a provider returns HTTP 402 (payment required), the auxiliary client auto-falls back to the next one.
      to: Когда провайдер возвращает HTTP 402 (требуется оплата), вспомогательный клиент автоматически переключается на следующего.
    - id: cli_tips.tip_238
      family: cli_tips
      from: agent.tool_use_enforcement steers models that describe actions instead of calling tools — auto for GPT/Codex.
      to: agent.tool_use_enforcement направляет модели, которые описывают действия вместо вызова инструментов — для GPT/Codex включается автоматически.
    - id: cli_tips.tip_239
      family: cli_tips
      from: agent.restart_after_turn_timeout lets in-flight turns finish before /restart enters stop(); restart_drain_timeout is only the force-interrupt budget once stop() begins.
      to: agent.restart_after_turn_timeout даёт текущим ходам завершиться до вызова stop() командой /restart; restart_drain_timeout ограничивает только ожидание до принудительного прерывания после начала stop().
    - id: cli_tips.tip_240
      family: cli_tips
      from: agent.api_max_retries (default 3) controls how many times the agent retries a failed API call before surfacing the error — lower it for fast fallback.
      to: agent.api_max_retries (по умолчанию 3) задаёт число повторов неудачного вызова API до показа ошибки — уменьшите для быстрого перехода к резервной модели.
    - id: cli_tips.tip_241
      family: cli_tips
      from: The gateway caches AIAgent instances per session — destroying this cache breaks Anthropic prompt caching.
      to: Сервис Hermes кеширует экземпляры AIAgent для каждого сеанса — уничтожение этого кеша нарушает кеширование промптов Anthropic.
    - id: cli_tips.tip_242
      family: cli_tips
      from: Any website can expose skills via /.well-known/skills/index.json — the skills hub discovers them automatically.
      to: Любой сайт может публиковать навыки через /.well-known/skills/index.json — каталог навыков обнаруживает их автоматически.
    - id: cli_tips.tip_243
      family: cli_tips
      from: The skills audit log at ~/.hermes/skills/.hub/audit.log tracks every install and removal operation.
      to: Журнал аудита навыков ~/.hermes/skills/.hub/audit.log фиксирует каждую установку и удаление.
    - id: cli_tips.tip_244
      family: cli_tips
      from: 'Stale git worktrees are auto-cleaned on startup: clean, fully-merged trees get pruned; dirty or unpushed work is always preserved.'
      to: 'Устаревшие рабочие деревья git очищаются при запуске: чистые и полностью слитые удаляются; незакоммиченная или неотправленная работа всегда сохраняется.'
    - id: cli_tips.tip_245
      family: cli_tips
      from: Profiles scope Hermes state via HERMES_HOME; host tool subprocesses keep your real HOME unless terminal.home_mode is profile.
      to: Профили изолируют состояние Hermes через HERMES_HOME; подпроцессы инструментов на хосте сохраняют настоящий HOME, если terminal.home_mode не задан как profile.
    - id: cli_tips.tip_246
      family: cli_tips
      from: HERMES_HOME_MODE env var (octal, e.g. 0701) sets custom directory permissions for web server traversal.
      to: Переменная HERMES_HOME_MODE (восьмеричное значение, например 0701) задаёт права каталога, позволяющие веб-серверу проходить через него.
    - id: cli_tips.tip_247
      family: cli_tips
      from: 'Container mode: place .container-mode in HERMES_HOME and the host CLI auto-execs into the container.'
      to: 'Контейнерный режим: поместите .container-mode в HERMES_HOME, и CLI хоста автоматически запустит команду внутри контейнера.'
    - id: cli_tips.tip_248
      family: cli_tips
      from: 'Ctrl+C has 5 priority tiers: cancel recording → cancel prompts → cancel picker → interrupt agent → exit.'
      to: 'Ctrl+C имеет 5 уровней приоритета: отмена записи → отмена запросов → отмена выбора → прерывание агента → выход.'
    - id: cli_tips.tip_249
      family: cli_tips
      from: Every interrupt during an agent run is logged to ~/.hermes/interrupt_debug.log with timestamps.
      to: Каждое прерывание во время работы агента записывается в ~/.hermes/interrupt_debug.log с временной меткой.
    - id: cli_tips.tip_250
      family: cli_tips
      from: BROWSER_CDP_URL connects browser tools to any running Chromium-family browser — accepts WebSocket, HTTP, or host:port.
      to: BROWSER_CDP_URL подключает браузерные инструменты к любому запущенному браузеру семейства Chromium — принимает WebSocket, HTTP или host:port.
    - id: cli_tips.tip_251
      family: cli_tips
      from: BROWSERBASE_ADVANCED_STEALTH=true enables advanced anti-detection with custom Chromium (Scale Plan).
      to: BROWSERBASE_ADVANCED_STEALTH=true включает расширенную защиту от обнаружения с модифицированным Chromium (Scale Plan).
    - id: cli_tips.tip_252
      family: cli_tips
      from: The CLI auto-switches to compact mode in terminals narrower than 80 columns.
      to: CLI автоматически переходит в компактный режим в терминалах шириной менее 80 столбцов.
    - id: cli_tips.tip_253
      family: cli_tips
      from: 'Quick commands support two types: exec (run shell command directly) and alias (redirect to another command).'
      to: 'Быстрые команды поддерживают два типа: exec (прямой запуск команды оболочки) и alias (перенаправление на другую команду).'
    - id: cli_tips.tip_254
      family: cli_tips
      from: 'Per-task delegation model: delegation.model and delegation.provider in config route subagents to cheaper models.'
      to: 'Модель делегирования для задач: delegation.model и delegation.provider в конфигурации направляют субагентов на более дешёвые модели.'
    - id: cli_tips.tip_255
      family: cli_tips
      from: delegation.reasoning_effort independently controls thinking depth for subagents.
      to: delegation.reasoning_effort независимо задаёт глубину рассуждений субагентов.
    - id: cli_tips.tip_256
      family: cli_tips
      from: 'display.platforms in config.yaml allows per-platform display overrides: {config_example}.'
      to: 'display.platforms в config.yaml позволяет отдельно переопределять отображение для платформ: {config_example}.'
      placeholders:
        config_example: \{telegram:\ \{tool_progress:\ all\}\}
    - id: cli_tips.tip_257
      family: cli_tips
      from: human_delay.mode in config simulates human typing speed — configurable min_ms/max_ms range.
      to: human_delay.mode в конфигурации имитирует скорость человеческого набора — диапазон задаётся min_ms/max_ms.
    - id: cli_tips.tip_258
      family: cli_tips
      from: Config version migrations run automatically on load — new config keys appear without manual intervention.
      to: Миграции версий конфигурации выполняются при загрузке автоматически — новые ключи появляются без ручного вмешательства.
    - id: cli_tips.tip_259
      family: cli_tips
      from: GPT and Codex models get special system prompt guidance for tool discipline and mandatory tool use.
      to: Модели GPT и Codex получают специальные указания системного промпта о дисциплине и обязательном использовании инструментов.
    - id: cli_tips.tip_260
      family: cli_tips
      from: Gemini models get tailored directives for absolute paths, parallel tool calls, and non-interactive commands.
      to: Модели Gemini получают специальные указания об абсолютных путях, параллельных вызовах инструментов и неинтерактивных командах.
    - id: cli_tips.tip_261
      family: cli_tips
      from: context.engine in config.yaml can be set to a plugin name for alternative context management strategies.
      to: context.engine в config.yaml можно задать именем плагина для альтернативной стратегии управления контекстом.
    - id: cli_tips.tip_262
      family: cli_tips
      from: Browser page snapshots over 15,000 characters are truncated or auto-summarized; the full snapshot is saved to cache/web for read_file paging.
      to: Снимки страниц браузера длиннее 15 000 символов сокращаются или автоматически сводятся в резюме; полный снимок сохраняется в cache/web для постраничного чтения через read_file.
    - id: cli_tips.tip_263
      family: cli_tips
      from: 'The compressor does a cheap pre-pass: tool outputs over 200 chars are replaced with placeholders before the LLM runs.'
      to: 'Перед сжатием выполняется экономичная подготовка: вывод инструментов длиннее 200 символов заменяется заглушками до вызова LLM.'
    - id: cli_tips.tip_264
      family: cli_tips
      from: When compression fails, further attempts are paused for 10 minutes to avoid API hammering.
      to: При ошибке сжатия следующие попытки приостанавливаются на 10 минут, чтобы не перегружать API.
    - id: cli_tips.tip_265
      family: cli_tips
      from: Long dangerous commands (>70 chars) get a 'view' option in the approval prompt to see the full text first.
      to: Для длинных опасных команд (>70 символов) запрос подтверждения предлагает вариант 'view', позволяющий сначала увидеть полный текст.
    - id: cli_tips.tip_266
      family: cli_tips
      from: Audio level visualization shows ▁▂▃▄▅▆▇ bars during voice recording based on microphone RMS levels.
      to: При записи голоса визуализация громкости показывает столбцы ▁▂▃▄▅▆▇ на основе среднеквадратичного уровня сигнала микрофона.
    - id: cli_tips.tip_267
      family: cli_tips
      from: Profile names cannot collide with existing PATH binaries — 'hermes profile create ls' would be rejected.
      to: Имена профилей не могут совпадать с существующими программами в PATH — 'hermes profile create ls' будет отклонена.
    - id: cli_tips.tip_268
      family: cli_tips
      from: hermes profile create backup --clone-all copies everything (config, keys, SOUL.md, memories, skills, sessions).
      to: 'hermes profile create backup --clone-all копирует всё: конфигурацию, ключи, SOUL.md, память, навыки и сеансы.'
    - id: cli_tips.tip_269
      family: cli_tips
      from: The voice record key is configurable via voice.record_key in config.yaml — not just Ctrl+B.
      to: Клавиша записи голоса настраивается через voice.record_key в config.yaml — не обязательно Ctrl+B.
    - id: cli_tips.tip_270
      family: cli_tips
      from: .cursorrules and .cursor/rules/*.mdc files are auto-detected and loaded as project context.
      to: Файлы .cursorrules и .cursor/rules/*.mdc автоматически обнаруживаются и загружаются как контекст проекта.
    - id: cli_tips.tip_271
      family: cli_tips
      from: Context files support 10+ prompt injection patterns — invisible Unicode, 'ignore instructions', exfil attempts.
      to: 'Проверка файлов контекста распознаёт более 10 шаблонов внедрения инструкций: невидимый Unicode, «игнорируй инструкции», попытки утечки данных.'
    - id: cli_tips.tip_272
      family: cli_tips
      from: GPT-5 and Codex use 'developer' role instead of 'system' in the message format.
      to: GPT-5 и Codex используют роль 'developer' вместо 'system' в формате сообщений.
    - id: cli_tips.tip_273
      family: cli_tips
      from: 'Per-task auxiliary overrides: auxiliary.vision.provider, auxiliary.compression.model, etc. in config.yaml.'
      to: 'Переопределения вспомогательных задач: auxiliary.vision.provider, auxiliary.compression.model и другие параметры в config.yaml.'
    - id: cli_tips.tip_274
      family: cli_tips
      from: The auxiliary client treats 'main' as a provider alias — resolves to your actual primary provider + model.
      to: Вспомогательный клиент трактует 'main' как псевдоним провайдера — подставляет вашего основного провайдера и модель.
    - id: cli_tips.tip_275
      family: cli_tips
      from: hermes claw migrate --dry-run previews OpenClaw migration without writing anything.
      to: hermes claw migrate --dry-run показывает предварительный результат миграции OpenClaw, ничего не записывая.
    - id: cli_tips.tip_276
      family: cli_tips
      from: File paths pasted with quotes or escaped spaces are handled automatically — no manual cleanup needed.
      to: Пути файлов, вставленные с кавычками или экранированными пробелами, обрабатываются автоматически — ручная очистка не нужна.
    - id: cli_tips.tip_277
      family: cli_tips
      from: Slash commands never trigger the large-paste collapse — /command with big arguments works correctly.
      to: Команды с косой чертой никогда не сворачиваются как большие вставки — /command с объёмными аргументами работает корректно.
    - id: cli_tips.tip_278
      family: cli_tips
      from: In interrupt mode, slash commands typed during agent execution bypass interrupt logic and run immediately.
      to: В режиме interrupt команды с косой чертой, введённые во время работы агента, обходят логику прерывания и выполняются сразу.
    - id: cli_tips.tip_279
      family: cli_tips
      from: HERMES_DEV=1 bypasses container mode detection for local development.
      to: HERMES_DEV=1 отключает определение контейнерного режима для локальной разработки.
    - id: cli_tips.tip_280
      family: cli_tips
      from: Each MCP server gets its own toolset (mcp-servername) that can be toggled independently via hermes tools.
      to: Каждый сервер MCP получает собственный набор инструментов (mcp-servername), который можно независимо переключать через hermes tools.
    - id: cli_tips.tip_281
      family: cli_tips
      from: MCP ${env_example} placeholders in config are resolved at server spawn — including vars from ~/.hermes/.env.
      to: Подстановки MCP ${env_example} в конфигурации раскрываются при запуске сервера, включая переменные из ~/.hermes/.env.
      placeholders:
        env_example: \{ENV_VAR\}
    - id: cli_tips.tip_282
      family: cli_tips
      from: Skills from trusted repos (NousResearch) get a 'trusted' security level; community skills get extra scanning.
      to: Навыки из доверенных репозиториев (NousResearch) получают уровень безопасности 'trusted'; навыки сообщества проходят дополнительную проверку.
    - id: cli_tips.tip_283
      family: cli_tips
      from: The skills quarantine at ~/.hermes/skills/.hub/quarantine/ holds skills pending security review.
      to: В карантине ~/.hermes/skills/.hub/quarantine/ хранятся навыки, ожидающие проверки безопасности.
    - id: cli_tips.tip_284
      family: cli_tips
      from: /steer <prompt> injects a note after the next tool call — nudge direction mid-task without interrupting.
      to: /steer <prompt> добавляет заметку после следующего вызова инструмента — корректируйте направление задачи, не прерывая работу.
    - id: cli_tips.tip_285
      family: cli_tips
      from: /goal <text> sets a standing Ralph-loop objective — Hermes auto-continues turn after turn until a judge says done.
      to: /goal <text> задаёт постоянную цель цикла Ralph — Hermes автоматически продолжает ход за ходом, пока оценщик не подтвердит завершение.
    - id: cli_tips.tip_286
      family: cli_tips
      from: /snapshot create [label] saves a full state snapshot of Hermes config; /snapshot restore <id> reverts later.
      to: /snapshot create [label] сохраняет полный снимок состояния конфигурации Hermes; /snapshot restore <id> позволяет восстановить его позже.
    - id: cli_tips.tip_287
      family: cli_tips
      from: /copy [N] copies the last assistant response to your clipboard, or the Nth-from-last with a number.
      to: /copy [N] копирует последний ответ ассистента в буфер обмена, а с числом — N-й ответ с конца.
    - id: cli_tips.tip_288
      family: cli_tips
      from: /redraw forces a full UI repaint, fixing terminal drift after tmux resize or mouse selection artifacts.
      to: /redraw полностью перерисовывает интерфейс, устраняя искажения после изменения размера tmux или выделения мышью.
    - id: cli_tips.tip_289
      family: cli_tips
      from: /agents (alias /tasks) shows active agents and running background tasks across the current session.
      to: /agents (псевдоним /tasks) показывает активных агентов и работающие фоновые задачи текущего сеанса.
    - id: cli_tips.tip_290
      family: cli_tips
      from: /footer toggles the gateway footer on final replies showing model, context %, and cwd.
      to: /footer переключает подвал окончательных ответов сервиса Hermes с моделью, заполнением контекста в % и cwd.
    - id: cli_tips.tip_291
      family: cli_tips
      from: /busy queue|steer|interrupt controls what pressing Enter does while Hermes is working.
      to: /busy queue|steer|interrupt задаёт поведение Enter во время работы Hermes.
    - id: cli_tips.tip_292
      family: cli_tips
      from: /topic in Telegram DMs enables user-managed multi-session topic mode — /topic <id> restores past sessions inline.
      to: /topic в личных сообщениях Telegram включает управляемый пользователем режим тем с несколькими сеансами — /topic <id> восстанавливает прошлый сеанс прямо в чате.
    - id: cli_tips.tip_293
      family: cli_tips
      from: /approve session|always runs a pending dangerous command with your chosen trust scope; /deny rejects it.
      to: /approve session|always выполняет ожидающую опасную команду с выбранным уровнем доверия; /deny отклоняет её.
    - id: cli_tips.tip_294
      family: cli_tips
      from: /restart gracefully restarts the gateway after draining active runs, then pings the requester when back up.
      to: /restart корректно перезапускает сервис Hermes после завершения активных задач и уведомляет запросившего пользователя о готовности.
    - id: cli_tips.tip_295
      family: cli_tips
      from: /kanban boards switch <slug> changes the active multi-project Kanban board from inside chat.
      to: /kanban boards switch <slug> переключает активную многопроектную доску Kanban прямо из чата.
    - id: cli_tips.tip_296
      family: cli_tips
      from: /reload reloads ~/.hermes/.env into the running session — pick up new API keys without restarting.
      to: /reload заново загружает ~/.hermes/.env в текущий сеанс — новые API-ключи применяются без перезапуска.
    - id: cli_tips.tip_297
      family: cli_tips
      from: cronjob with no_agent=True runs a script on schedule and sends its stdout directly — zero tokens, zero LLM.
      to: cronjob с no_agent=True запускает скрипт по расписанию и напрямую отправляет его stdout — без токенов и LLM.
    - id: cli_tips.tip_298
      family: cli_tips
      from: An empty cron script stdout means silent tick — nothing is delivered, perfect for threshold watchdogs.
      to: Пустой stdout скрипта Cron означает тихое выполнение — ничего не доставляется; удобно для наблюдения за пороговыми значениями.
    - id: cli_tips.tip_299
      family: cli_tips
      from: HERMES_CRON_MAX_PARALLEL (default 4) caps how many cron jobs run per tick so bursts don't saturate your keys.
      to: HERMES_CRON_MAX_PARALLEL (по умолчанию 4) ограничивает число заданий Cron за один такт, чтобы всплески не перегружали ваши ключи.
    - id: cli_tips.tip_300
      family: cli_tips
      from: Gateway hooks live under ~/.hermes/hooks/<name>/ with HOOK.yaml + handler.py — handler must be named `handle`.
      to: Обработчики событий сервиса Hermes находятся в ~/.hermes/hooks/<name>/ с HOOK.yaml и handler.py — функция должна называться `handle`.
    - id: cli_tips.tip_301
      family: cli_tips
      from: Hook events include gateway:startup, session:start, agent:step, and command:* wildcard subscriptions.
      to: События обработчиков включают gateway:startup, session:start, agent:step и подписки по шаблону command:*.
    - id: cli_tips.tip_302
      family: cli_tips
      from: Drop a ~/.hermes/BOOT.md checklist and a gateway:startup hook runs it as a one-shot agent every boot.
      to: Поместите список действий в ~/.hermes/BOOT.md, и обработчик gateway:startup будет выполнять его разовым запуском агента при каждом старте.
    - id: cli_tips.tip_303
      family: cli_tips
      from: hermes curator run --dry-run previews what the curator would archive or consolidate without mutating anything.
      to: hermes curator run --dry-run показывает, что куратор архивирует или объединит, ничего не изменяя.
    - id: cli_tips.tip_304
      family: cli_tips
      from: hermes curator pin <skill> hard-fences a skill against both auto-archival and the agent's skill_manage tool.
      to: hermes curator pin <skill> защищает навык и от автоматического архивирования, и от инструмента агента skill_manage.
    - id: cli_tips.tip_305
      family: cli_tips
      from: hermes curator rollback restores skills from a pre-run snapshot — backups live under skills/.curator_backups/.
      to: hermes curator rollback восстанавливает навыки из снимка перед запуском — резервные копии находятся в skills/.curator_backups/.
    - id: cli_tips.tip_306
      family: cli_tips
      from: hermes auth reset <provider> clears all cooldowns and exhaustion flags on a credential pool.
      to: hermes auth reset <provider> сбрасывает все периоды ожидания и признаки исчерпания в пуле учётных данных.
    - id: cli_tips.tip_307
      family: cli_tips
      from: 'credential_pool_strategies.<provider>: round_robin cycles keys evenly instead of the fill_first default.'
      to: 'credential_pool_strategies.<provider>: round_robin равномерно чередует ключи вместо стратегии fill_first по умолчанию.'
    - id: cli_tips.tip_308
      family: cli_tips
      from: 'use_gateway: true per-tool routes web, image, tts, or browser through your Nous subscription — no extra keys.'
      to: 'use_gateway: true для инструмента направляет web, image, tts или browser через подписку Nous — дополнительные ключи не нужны.'
    - id: cli_tips.tip_309
      family: cli_tips
      from: 'provider_routing.data_collection: deny excludes data-storing providers on OpenRouter.'
      to: 'provider_routing.data_collection: deny исключает провайдеров OpenRouter, сохраняющих данные.'
    - id: cli_tips.tip_310
      family: cli_tips
      from: 'provider_routing.require_parameters: true only routes to providers that support every param in your request.'
      to: 'provider_routing.require_parameters: true направляет запросы только провайдерам, поддерживающим каждый параметр запроса.'
    - id: cli_tips.tip_311
      family: cli_tips
      from: HERMES_TUI_RESUME=1 auto-re-attaches to the most recent TUI session on launch — handy after SSH drops.
      to: HERMES_TUI_RESUME=1 автоматически подключается к последнему сеансу TUI при запуске — удобно после обрыва SSH.
    - id: cli_tips.tip_312
      family: cli_tips
      from: HERMES_TUI_THEME=light|dark|<hex> forces the TUI theme on terminals that don't set COLORFGBG.
      to: HERMES_TUI_THEME=light|dark|<hex> принудительно задаёт тему TUI в терминалах, которые не устанавливают COLORFGBG.
    - id: cli_tips.tip_313
      family: cli_tips
      from: Ctrl+G or Ctrl+X Ctrl+E in the TUI opens the input buffer in $EDITOR for long multi-line prompts.
      to: Ctrl+G или Ctrl+X Ctrl+E в TUI открывает буфер ввода в $EDITOR для длинных многострочных запросов.
    - id: cli_tips.tip_314
      family: cli_tips
      from: The TUI renders LaTeX inline — $E=mc^2$ becomes Unicode math instead of raw TeX.
      to: TUI отображает LaTeX прямо в тексте — $E=mc^2$ превращается в математическую запись Unicode вместо исходного TeX.
    - id: cli_tips.tip_315
      family: cli_tips
      from: hermes dashboard launches a local web UI at 127.0.0.1:9119 — zero data leaves localhost.
      to: hermes dashboard запускает локальный веб-интерфейс на 127.0.0.1:9119 — данные не покидают localhost.
    - id: cli_tips.tip_316
      family: cli_tips
      from: hermes dashboard embeds the full Hermes TUI in your browser via xterm.js and a WebSocket PTY.
      to: hermes dashboard встраивает полный TUI Hermes в браузер через xterm.js и WebSocket PTY.
    - id: cli_tips.tip_317
      family: cli_tips
      from: Drop a YAML in ~/.hermes/dashboard-themes/ with two palette colors to reskin the entire dashboard.
      to: Поместите YAML с двумя цветами палитры в ~/.hermes/dashboard-themes/, чтобы изменить оформление всей панели.
    - id: cli_tips.tip_318
      family: cli_tips
      from: 'Dashboard plugins are drop-in: manifest.json + JS bundle in ~/.hermes/dashboard-plugins/ — no npm build required.'
      to: 'Плагины панели подключаются размещением файлов: manifest.json и сборка JS в ~/.hermes/dashboard-plugins/ — сборка через npm не требуется.'
    - id: cli_tips.tip_319
      family: cli_tips
      from: 'layoutVariant: cockpit in a dashboard theme adds a 260px left rail that plugins can populate via the sidebar slot.'
      to: 'layoutVariant: cockpit в теме панели добавляет левую колонку шириной 260px, которую плагины могут заполнять через слот sidebar.'
    - id: cli_tips.tip_320
      family: cli_tips
      from: 'display.tool_progress_command: true exposes /verbose on messaging platforms; it''s CLI-only by default.'
      to: 'display.tool_progress_command: true делает /verbose доступной на платформах обмена сообщениями; по умолчанию она доступна только в CLI.'
    - id: cli_tips.tip_321
      family: cli_tips
      from: HERMES_BACKGROUND_NOTIFICATIONS=result only pings when background tasks finish (vs concise/all/error/off).
      to: HERMES_BACKGROUND_NOTIFICATIONS=result уведомляет только о завершении фоновых задач (в отличие от concise/all/error/off).
    - id: cli_tips.tip_322
      family: cli_tips
      from: 'HERMES_WRITE_SAFE_ROOT restricts write_file/patch to directory prefixes; multiple paths via os.pathsep (: or ;).'
      to: 'HERMES_WRITE_SAFE_ROOT ограничивает write_file/patch префиксами каталогов; несколько путей разделяются os.pathsep (: или ;).'
    - id: cli_tips.tip_323
      family: cli_tips
      from: HERMES_IGNORE_RULES skips auto-injection of AGENTS.md, SOUL.md, .cursorrules, memory, and preloaded skills.
      to: HERMES_IGNORE_RULES отключает автоматическое добавление AGENTS.md, SOUL.md, .cursorrules, памяти и заранее загруженных навыков.
    - id: cli_tips.tip_324
      family: cli_tips
      from: HERMES_ACCEPT_HOOKS auto-approves unseen shell hooks declared in config.yaml without a TTY prompt.
      to: HERMES_ACCEPT_HOOKS автоматически разрешает ранее не встречавшиеся обработчики оболочки из config.yaml без запроса в TTY.
    - id: cli_tips.tip_325
      family: cli_tips
      from: auxiliary.goal_judge.model routes the /goal judge to a cheap fast model to keep loop cost near zero.
      to: auxiliary.goal_judge.model направляет оценщик /goal на дешёвую быструю модель, сводя стоимость цикла почти к нулю.
    - id: cli_tips.tip_326
      family: cli_tips
      from: Checkpoints skip directories with more than 50,000 files to avoid slow git operations on massive monorepos.
      to: Контрольные точки пропускают каталоги с более чем 50 000 файлов, чтобы избежать медленных операций git в огромных монорепозиториях.
    - id: cli_tips.tip_327
      family: cli_tips
      from: 'tts.provider: piper runs 44-language local TTS on CPU — voices auto-download to ~/.hermes/cache/piper-voices/.'
      to: 'tts.provider: piper запускает локальный TTS на CPU для 44 языков — голоса автоматически загружаются в ~/.hermes/cache/piper-voices/.'
    - id: cli_tips.tip_328
      family: cli_tips
      from: 'tts.providers.<name>.type: command wires any CLI TTS engine with {input_path} and {output_path} placeholders.'
      to: 'tts.providers.<name>.type: command подключает любой движок TTS командной строки с подстановками {input_path} и {output_path}.'
      placeholders:
        input_path: \{input_path\}
        output_path: \{output_path\}
    - id: cli_tips.tip_329
      family: cli_tips
      from: API_SERVER_ENABLED=true runs an OpenAI-compatible endpoint alongside the gateway for Open WebUI and LibreChat.
      to: API_SERVER_ENABLED=true запускает OpenAI-совместимую конечную точку рядом с сервисом Hermes для Open WebUI и LibreChat.
    - id: cli_tips.tip_330
      family: cli_tips
      from: 'GATEWAY_PROXY_URL runs a split setup: platform I/O locally, agent work delegated to a remote API server.'
      to: 'GATEWAY_PROXY_URL включает разделённую схему: обмен с платформами выполняется локально, работа агента передаётся удалённому серверу API.'
    - id: cli_tips.tip_331
      family: cli_tips
      from: MATRIX_DEVICE_ID pins a stable device ID for E2EE — without it, keys rotate every start and historic decrypt breaks.
      to: MATRIX_DEVICE_ID закрепляет постоянный ID устройства для E2EE — без него ключи меняются при каждом запуске и расшифровка старых сообщений нарушается.
    - id: cli_tips.tip_332
      family: cli_tips
      from: TELEGRAM_WEBHOOK_SECRET is required whenever TELEGRAM_WEBHOOK_URL is set — generate with openssl rand -hex 32.
      to: TELEGRAM_WEBHOOK_SECRET обязателен при заданном TELEGRAM_WEBHOOK_URL — сгенерируйте его через openssl rand -hex 32.
    - id: cli_tips.tip_333
      family: cli_tips
      from: batch_runner.py --resume content-matches completed prompts by text so dataset reorders don't re-run finished work.
      to: batch_runner.py --resume сопоставляет выполненные запросы по тексту, чтобы перестановка набора данных не запускала готовую работу повторно.
    - id: cli_tips.tip_334
      family: cli_tips
      from: /new starts a fresh session in place (alias /reset) — fresh session ID, clean history, CLI stays open.
      to: /new начинает новый сеанс на месте (псевдоним /reset) — новый ID, чистая история, CLI остаётся открытым.
    - id: cli_tips.tip_335
      family: cli_tips
      from: /clear wipes the terminal screen AND starts a new session — one shortcut for a visual reset.
      to: /clear очищает экран терминала И начинает новый сеанс — одна команда для визуального сброса.
    - id: cli_tips.tip_336
      family: cli_tips
      from: /history prints the current conversation in-line without leaving the CLI — useful for a quick re-read.
      to: /history выводит текущий диалог прямо в CLI — удобно быстро перечитать его.
    - id: cli_tips.tip_337
      family: cli_tips
      from: /save writes the current conversation to disk without ending the session.
      to: /save сохраняет текущий диалог на диск, не завершая сеанс.
    - id: cli_tips.tip_338
      family: cli_tips
      from: '/status shows session info at a glance: ID, title, model, token usage, and elapsed time.'
      to: '/status кратко показывает сведения о сеансе: ID, название, модель, расход токенов и прошедшее время.'
    - id: cli_tips.tip_339
      family: cli_tips
      from: /image <path> attaches a local image file for your next prompt without pasting or drag-and-drop.
      to: /image <path> прикрепляет локальное изображение к следующему запросу без вставки или перетаскивания.
    - id: cli_tips.tip_340
      family: cli_tips
      from: /platforms shows gateway and messaging-platform connection status right from inside chat.
      to: /platforms показывает состояние сервиса Hermes и подключений к платформам прямо из чата.
    - id: cli_tips.tip_341
      family: cli_tips
      from: /commands paginates the full slash-command + installed-skill list — useful on platforms without tab completion.
      to: /commands постранично показывает полный список команд с косой чертой и установленных навыков — удобно на платформах без дополнения по Tab.
    - id: cli_tips.tip_342
      family: cli_tips
      from: /toolsets lists every available toolset so you know what -t/--toolsets accepts.
      to: /toolsets перечисляет все доступные наборы инструментов, чтобы было понятно, что принимает -t/--toolsets.
    - id: cli_tips.tip_343
      family: cli_tips
      from: /voice tts toggles TTS-only mode — agent replies out loud but you still type your prompts.
      to: /voice tts переключает режим только озвучивания — агент отвечает голосом, но запросы вы вводите текстом.
    - id: cli_tips.tip_344
      family: cli_tips
      from: /reload-skills re-scans ~/.hermes/skills/ so drop-in skills appear without restarting the session.
      to: /reload-skills повторно сканирует ~/.hermes/skills/, чтобы добавленные навыки появились без перезапуска сеанса.
    - id: cli_tips.tip_345
      family: cli_tips
      from: /indicator kaomoji|emoji|unicode|ascii picks the TUI busy-indicator style shown during agent runs.
      to: /indicator kaomoji|emoji|unicode|ascii выбирает стиль индикатора занятости TUI во время работы агента.
    - id: cli_tips.tip_346
      family: cli_tips
      from: /debug uploads a support bundle (system info + logs) and returns shareable links — works in chat too.
      to: /debug загружает пакет для поддержки (сведения о системе и журналы) и возвращает ссылки для отправки — работает и в чате.
    - id: cli_tips.tip_347
      family: cli_tips
      from: 'hermes -z "<prompt>" is the purest one-shot: final answer on stdout, nothing else — ideal for piping in scripts.'
      to: 'hermes -z "<prompt>" выполняет разовый запрос с минимальным выводом: только окончательный ответ в stdout — удобно для конвейеров в скриптах.'
    - id: cli_tips.tip_348
      family: cli_tips
      from: hermes chat --pass-session-id injects the session ID into the system prompt so the agent can self-reference it.
      to: hermes chat --pass-session-id добавляет ID сеанса в системный промпт, чтобы агент мог ссылаться на свой сеанс.
    - id: cli_tips.tip_349
      family: cli_tips
      from: hermes chat --image path/to/pic.png attaches a local image to a single -q query without a separate upload step.
      to: hermes chat --image path/to/pic.png прикрепляет локальное изображение к разовому запросу -q без отдельной загрузки.
    - id: cli_tips.tip_350
      family: cli_tips
      from: hermes chat --ignore-user-config skips the active user config — reproducible bug reports and CI runs.
      to: hermes chat --ignore-user-config пропускает активную пользовательскую конфигурацию — удобно для воспроизводимых сообщений об ошибках и запусков CI.
    - id: cli_tips.tip_351
      family: cli_tips
      from: hermes chat --source tool tags programmatic chats so they don't clutter hermes sessions list.
      to: hermes chat --source tool помечает программные диалоги, чтобы они не загромождали hermes sessions list.
    - id: cli_tips.tip_352
      family: cli_tips
      from: hermes dump --show-keys includes redacted API key fingerprints for deeper support debugging.
      to: hermes dump --show-keys включает отпечатки API-ключей со скрытыми секретными данными для углублённой диагностики поддержкой.
    - id: cli_tips.tip_353
      family: cli_tips
      from: hermes sessions rename <ID> "new title" renames any past session; hermes sessions delete <ID> removes one.
      to: hermes sessions rename <ID> "new title" переименовывает любой прошлый сеанс; hermes sessions delete <ID> удаляет его.
    - id: cli_tips.tip_354
      family: cli_tips
      from: hermes import restores a full Hermes backup zip; session JSON/JSONL exports import from the dashboard Sessions page.
      to: hermes import восстанавливает полную резервную копию Hermes из zip; экспортированные сеансы JSON/JSONL импортируются со страницы Sessions панели.
    - id: cli_tips.tip_355
      family: cli_tips
      from: hermes fallback manages the fallback_model chain interactively — no hand-editing config.yaml.
      to: hermes fallback интерактивно управляет цепочкой fallback_model — редактировать config.yaml вручную не нужно.
    - id: cli_tips.tip_356
      family: cli_tips
      from: hermes pairing rotates the DM pairing token — the first messager after rotation claims access to the bot.
      to: hermes pairing меняет токен привязки личных сообщений — первый написавший после смены получает доступ к боту.
    - id: cli_tips.tip_357
      family: cli_tips
      from: hermes setup walks first-time users through provider, keys, and platform wiring in one interactive flow.
      to: hermes setup проводит новых пользователей через выбор провайдера, ключей и подключение платформ в одном интерактивном процессе.
    - id: cli_tips.tip_358
      family: cli_tips
      from: hermes status --deep runs the full health sweep across every component; plain hermes status is the quick view.
      to: hermes status --deep выполняет полную проверку всех компонентов; обычная hermes status показывает краткую сводку.
    - id: cli_tips.tip_359
      family: cli_tips
      from: HERMES_AGENT_TIMEOUT=0 disables the gateway inactivity kill for a running agent — use for long research runs.
      to: HERMES_AGENT_TIMEOUT=0 отключает завершение работающего агента по бездействию в сервисе Hermes — подходит для длительных исследований.
    - id: cli_tips.tip_360
      family: cli_tips
      from: HERMES_ENABLE_PROJECT_PLUGINS=1 auto-loads repo-local plugins from ./.hermes/plugins/ — trust-gated by design.
      to: HERMES_ENABLE_PROJECT_PLUGINS=1 автоматически загружает плагины репозитория из ./.hermes/plugins/ — только при разрешённом доверии.
    - id: cli_tips.tip_361
      family: cli_tips
      from: HERMES_DISABLE_FILE_STATE_GUARD=1 turns off the 'file changed since you read it' guard on patch and write_file.
      to: HERMES_DISABLE_FILE_STATE_GUARD=1 отключает проверку «файл изменился после чтения» для patch и write_file.
    - id: cli_tips.tip_362
      family: cli_tips
      from: HERMES_ALLOW_PRIVATE_URLS=true lets web tools hit localhost and private networks — off by default in gateway mode.
      to: HERMES_ALLOW_PRIVATE_URLS=true разрешает веб-инструментам обращаться к localhost и частным сетям — по умолчанию отключено в режиме сервиса Hermes.
    - id: cli_tips.tip_363
      family: cli_tips
      from: HERMES_OPTIONAL_SKILLS=name1,name2 auto-installs extra optional-catalog skills on first run per profile.
      to: HERMES_OPTIONAL_SKILLS=name1,name2 автоматически устанавливает дополнительные навыки из каталога при первом запуске каждого профиля.
    - id: cli_tips.tip_364
      family: cli_tips
      from: HERMES_BUNDLED_SKILLS points at a custom bundled-skill tree — used by Homebrew and Nix packaging.
      to: HERMES_BUNDLED_SKILLS указывает собственное дерево встроенных навыков — используется в пакетах Homebrew и Nix.
    - id: cli_tips.tip_365
      family: cli_tips
      from: HERMES_DUMP_REQUEST_STDOUT=1 dumps every API request payload to stdout instead of log files.
      to: HERMES_DUMP_REQUEST_STDOUT=1 выводит содержимое каждого запроса API в stdout вместо файлов журналов.
    - id: cli_tips.tip_366
      family: cli_tips
      from: HERMES_OAUTH_TRACE=1 logs redacted OAuth token exchange and refresh attempts for debugging provider auth.
      to: HERMES_OAUTH_TRACE=1 записывает обмен и обновление токенов OAuth со скрытыми секретными данными для диагностики авторизации провайдера.
    - id: cli_tips.tip_367
      family: cli_tips
      from: HERMES_STREAM_RETRIES (default 3) controls mid-stream reconnect attempts on transient network errors.
      to: HERMES_STREAM_RETRIES (по умолчанию 3) задаёт число попыток восстановления потокового соединения при временных сетевых ошибках.
    - id: cli_tips.tip_368
      family: cli_tips
      from: HERMES_GATEWAY_BUSY_ACK_ENABLED=false silences the ⚡/⏳/⏩ ack messages when a user messages a busy agent.
      to: HERMES_GATEWAY_BUSY_ACK_ENABLED=false отключает подтверждения ⚡/⏳/⏩, когда пользователь пишет занятому агенту.
    - id: cli_tips.tip_369
      family: cli_tips
      from: HERMES_AGENT_NOTIFY_INTERVAL (default 180s) sets how often the gateway pings with progress on long turns.
      to: HERMES_AGENT_NOTIFY_INTERVAL (по умолчанию 180s) задаёт частоту уведомлений сервиса Hermes о прогрессе на длинных ходах.
    - id: cli_tips.tip_370
      family: cli_tips
      from: HERMES_RESTART_DRAIN_TIMEOUT (default 900s) caps how long /restart waits for in-flight runs before forcing.
      to: HERMES_RESTART_DRAIN_TIMEOUT (по умолчанию 900s) ограничивает ожидание активных задач командой /restart до принудительного завершения.
    - id: cli_tips.tip_371
      family: cli_tips
      from: HERMES_CHECKPOINT_TIMEOUT (default 30s) caps filesystem checkpoint creation — raise it on huge monorepos.
      to: HERMES_CHECKPOINT_TIMEOUT (по умолчанию 30s) ограничивает время создания контрольной точки файловой системы — увеличьте для огромных монорепозиториев.
    - id: cli_tips.tip_372
      family: cli_tips
      from: 'image_gen.model in config.yaml picks the FAL model: flux-2/klein, gpt-image-2, nano-banana-pro, and more.'
      to: 'image_gen.model в config.yaml выбирает модель FAL: flux-2/klein, gpt-image-2, nano-banana-pro и другие.'
    - id: cli_tips.tip_373
      family: cli_tips
      from: image_gen.provider routes image generation through a plugin (OpenAI Images, Codex, FAL) instead of the default.
      to: image_gen.provider направляет генерацию изображений через плагин (OpenAI Images, Codex, FAL) вместо провайдера по умолчанию.
    - id: cli_tips.tip_374
      family: cli_tips
      from: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY point vision analysis at any OpenAI-compatible endpoint.
      to: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY направляют анализ изображений на любую OpenAI-совместимую конечную точку.
    - id: cli_tips.tip_375
      family: cli_tips
      from: 'security.tirith_fail_open: false makes Hermes block commands when the tirith scanner itself errors out.'
      to: 'security.tirith_fail_open: false заставляет Hermes блокировать команды при ошибке самого сканера tirith.'
    - id: cli_tips.tip_376
      family: cli_tips
      from: TIRITH_FAIL_OPEN env var overrides the tirith_fail_open config — a quick toggle without editing config.yaml.
      to: Переменная окружения TIRITH_FAIL_OPEN переопределяет параметр tirith_fail_open — быстрое переключение без редактирования config.yaml.
    - id: cli_tips.tip_377
      family: cli_tips
      from: --source tool chats are excluded from hermes sessions list by default — set --source explicitly to see them.
      to: Диалоги с --source tool по умолчанию исключены из hermes sessions list — явно укажите --source, чтобы увидеть их.
    - id: cli_tips.tip_378
      family: cli_tips
      from: Session IDs are timestamp-prefixed (20250305_091523_abcd) so sorting works naturally in ls and jq.
      to: ID сеансов начинаются с временной метки (20250305_091523_abcd), поэтому ls и jq естественным образом сортируют их по времени.
    - id: cli_tips.tip_379
      family: cli_tips
      from: API_SERVER_MODEL_NAME customizes the model name on /v1/models — essential for multi-profile Open WebUI setups.
      to: API_SERVER_MODEL_NAME задаёт имя модели в /v1/models — важно для многопрофильных конфигураций Open WebUI.
    - id: cli_tips.tip_380
      family: cli_tips
      from: Dashboard plugins are served from /dashboard-plugins/<name>/ — drop files into ~/.hermes/dashboard-plugins/.
      to: Плагины панели доступны по /dashboard-plugins/<name>/ — поместите файлы в ~/.hermes/dashboard-plugins/.
    - id: cli_tips.wrapper_en
      family: cli_tips
      from: '✦ Tip: {tip}'
      to: '✦ Совет: {tip}'
      placeholders:
        tip: .+?
    - id: cli_tips.wrapper_ru
      family: cli_tips
      from: '✦ Совет: {tip}'
      to: '✦ Совет: {tip}'
      placeholders:
        tip: .+?
  agent.onboarding.py:
    source_file: agent/onboarding.py
    rules:
    - id: onboarding.busy_first_queue
      family: onboarding
      from: 💡 First-time tip — I queued your message instead of interrupting. Send `/busy interrupt` to make new messages stop
        the current task immediately, or `/busy status` to check. This notice won't appear again.
      to: '💡 Подсказка: сообщение добавлено в очередь и будет обработано после текущей задачи. `/busy interrupt` — прерывать
        текущую задачу новым сообщением; `/busy status` — проверить режим. Эта подсказка больше не появится.'
    - id: onboarding.busy_first_steer
      family: onboarding
      from: 💡 First-time tip — I steered your message into the current run; it will arrive after the next tool call instead
        of interrupting. Send `/busy interrupt` or `/busy queue` to change this, or `/busy status` to check. This notice won't
        appear again.
      to: '💡 Подсказка: сообщение передано в текущую задачу и поступит после следующего вызова инструмента, без прерывания.
        Сменить режим: `/busy interrupt` или `/busy queue`; проверить: `/busy status`. Эта подсказка больше не появится.'
    - id: onboarding.busy_first_redirect
      family: onboarding
      from: 💡 First-time tip — I redirected the current run using your message. Completed work stays in context, and `/stop`
        still cancels the task. Send `/busy queue` to wait for a separate turn, or `/busy status` to check. This notice won't
        appear again.
      to: '💡 Подсказка: сообщение изменило направление текущей задачи. Результаты выполненной работы остаются в контексте; `/stop`
        отменяет задачу. `/busy queue` — отложить сообщение до отдельного хода; `/busy status` — проверить режим. Эта подсказка
        больше не появится.'
    - id: onboarding.busy_first_interrupt
      family: onboarding
      from: 💡 First-time tip — I just interrupted my current task to answer you. Send `/busy queue` to queue follow-ups for
        after the current task instead, `/busy steer` to inject them mid-run without interrupting, or `/busy status` to check.
        This notice won't appear again.
      to: '💡 Подсказка: я прервал текущую задачу, чтобы ответить тебе. `/busy queue` — обрабатывать следующие сообщения после
        завершения задачи; `/busy steer` — передавать их в текущую задачу без прерывания; `/busy status` — проверить режим.
        Эта подсказка больше не появится.'
  goal_notices_023:
    source_file: hermes_cli/goals.py
    rules:
    - id: gateway.goal.notice.blocked
      family: gateway.goal.notice
      from: '🚫 Goal judged unachievable — paused: {reason} Re-scope with /goal set, or override with /goal resume.'
      to: '🚫 Цель поставлена на паузу: по оценке Hermes, её нельзя выполнить в текущем виде. Причина: {reason}

        Уточните цель через /goal set или продолжите выполнение через /goal resume.'
      placeholders: {}
    - id: gateway.goal.notice.done
      family: gateway.goal.notice
      from: '✓ Goal achieved: {reason}'
      to: '✓ Цель достигнута: {reason}'
      placeholders: {}
    - id: gateway.goal.notice.continue
      family: gateway.goal.notice
      from: '↻ Continuing toward goal ({used}/{limit}): {reason}'
      to: '↻ Продолжаю работу над целью ({used}/{limit} ходов): {reason}'
      placeholders:
        used: '[0-9]+'
        limit: '[0-9]+'
    - id: gateway.goal.notice.waiting
      family: gateway.goal.notice
      from: '⏳ Goal parked — waiting on {target}: {reason}'
      to: '⏳ Работа над целью отложена до завершения {target}: {reason}'
      placeholders: {}
    - id: gateway.goal.notice.judge_waiting
      family: gateway.goal.notice
      from: '⏳ Goal parked (judge) — waiting on {target}: {reason}'
      to: '⏳ По решению модели-оценщика работа отложена до завершения {target}: {reason}'
      placeholders: {}
    - id: gateway.goal.notice.gate_failed
      family: gateway.goal.notice
      from: '✗ Quality gate failed ({used}/{limit} turns, attempt {attempt}/{retries}): $ {command}'
      to: '✗ Проверка не пройдена ({used}/{limit} ходов, попытка {attempt}/{retries}): $ {command}'
      placeholders:
        used: '[0-9]+'
        limit: '[0-9]+'
        attempt: '[0-9]+'
        retries: '[0-9]+'
    - id: gateway.goal.notice.budget
      family: gateway.goal.notice
      from: ⏸ Goal paused — {used}/{limit} turns used. Use /goal resume to keep going, or /goal clear to stop.
      to: '⏸ Цель поставлена на паузу: использовано {used}/{limit} ходов. Продолжить — /goal resume, снять цель — /goal clear.'
      placeholders:
        used: '[0-9]+'
        limit: '[0-9]+'
  provider_failures_023:
    source_file: agent/turn_failure_copy.py + agent/turn_recovery.py
    rules:
    - id: telegram.provider_023.role_alternation
      from: '{label} requires user and assistant turns to strictly alternate and rejected this conversation''s shape. Start a clean session with /new or switch models with /model.'
      to: '{label} отклонил запрос: этот провайдер требует, чтобы сообщения пользователя и ассистента строго чередовались. Начните новый сеанс через /new или смените модель через /model.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.account_policy
      from: '{label} refused this request because of a policy on your account (its data/privacy settings, or a block the model''s upstream provider placed on the account), so the model didn''t answer and retrying won''t help. Check the account with the provider, or switch models with /model.'
      to: '{label} отклонил запрос из-за настроек конфиденциальности или ограничения на аккаунте. Повтор запроса не поможет. Проверьте настройки аккаунта у провайдера или смените модель через /model.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.data_policy
      from: 'This conversation holds a result from a connected app that may only go to a model that does not train on your data, and ''{model}'' on {label} can''t promise that. Switch models with /model, run /compress to summarize the result away, or start fresh with /new. If you are on the free tier, no free model can take this content: upgrade, or use /compress or /new.'
      to: 'В диалоге есть данные подключённого приложения. Их можно отправлять только моделям, которые не обучаются на ваших данных. Для модели «{model}» у {label} такой гарантии нет. Смените модель через /model, сократите контекст через /compress или начните новый диалог через /new. На бесплатном тарифе доступных моделей для этих данных нет: смените тариф или используйте /compress либо /new.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.upstream_blocked
      from: 'A firewall/CDN in front of {label} blocked the request before it reached the model, so your key is probably fine. Set a custom User-Agent via the provider''s extra_headers, check the proxy/WAF rules, or switch providers with /model.'
      to: 'Защита на стороне {label} заблокировала запрос до того, как он дошёл до модели. Проверьте правила прокси или WAF, задайте User-Agent через extra_headers либо смените провайдера через /model.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.rejected
      from: '{label} rejected the request and retrying won''t help. Pick another model with /model, or check the details in `{home}/logs/agent.log`.'
      to: '{label} отклонил запрос. Повтор не поможет. Выберите другую модель через /model или посмотрите подробности в `{home}/logs/agent.log`.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.api_key
      from: '{label} rejected your API key, so the model can''t be reached. Update it in Settings → Providers, or run `hermes setup` in a terminal.'
      to: '{label} отклонил API-ключ, поэтому модель недоступна. Обновите ключ в разделе «Настройки → Провайдеры» или запустите `hermes setup` в терминале.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.model_not_found
      from: 'Model ''{model}'' isn''t available on {label}. Pick a different model with /model (or `hermes model` in a terminal).{hint}'
      to: 'Модель «{model}» недоступна у {label}. Выберите другую через /model или командой `hermes model` в терминале.'
      boundaries: [telegram.provider_failure]
      placeholders: {hint: '(?: If you typed the name yourself it may be missing its vendor prefix — did you mean ''[^''\n]+''\?)?'}
    - id: telegram.provider_023.format_error
      from: '{label} rejected this request as malformed, so the model didn''t answer. Start a clean session with /new or switch models with /model; if it keeps happening, run `hermes doctor`.'
      to: '{label} отклонил запрос из-за некорректного формата. Начните новый сеанс через /new или смените модель через /model. Если ошибка повторится, запустите `hermes doctor`.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.tls
      from: 'Hermes couldn''t verify {label}''s security certificate, so the connection was refused. This is usually a corporate proxy or an outdated certificate store on this computer — see the terminal or `{home}/logs/agent.log` for the exact fix, or try another provider with /model.'
      to: 'Hermes не смог проверить сертификат {label}. Возможные причины — корпоративный прокси или устаревшие сертификаты на компьютере. Подробности в терминале или в `{home}/logs/agent.log`. Другого провайдера можно выбрать через /model.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.content_policy
      from: '{label}''s safety filter refused this request, so the model didn''t answer. Try rewording your message or removing sensitive attachments, or switch to another model with /model.'
      to: 'Фильтр безопасности {label} отклонил запрос. Переформулируйте сообщение, уберите чувствительные вложения или выберите другую модель через /model.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.oauth
      from: '{label} rejected your sign-in, so the model can''t be reached. Sign in again: `{relogin}`.'
      to: '{label} отклонил вход, поэтому модель недоступна. Войдите заново: `{relogin}`.'
      boundaries: [telegram.provider_failure]
      placeholders: {label: '[^
\n]+?', relogin: '[^`
\n]+'}
    - id: telegram.provider_023.codex_app_server
      from: 'Codex app-server turn failed: {detail}. Fall back to default runtime with `/codex-runtime auto`.'
      to: 'Сбой Codex app-server: {detail}. Чтобы вернуться к обычному режиму, используйте `/codex-runtime auto`.'
      boundaries: [telegram.provider_failure]
    - id: telegram.provider_023.codex_resume
      from: 'Codex thread could not be resumed; starting a new one.'
      to: 'Не удалось восстановить диалог Codex. Начинаю новый.'
      boundaries: [telegram.provider_progress]
    - id: telegram.provider_023.fallback
      from: '⚠️ Rate limited — switching to fallback provider...'
      to: '⚠️ Достигнут лимит запросов. Переключаюсь на резервного провайдера…'
      boundaries: [telegram.provider_progress]
    - id: telegram.provider_023.codex_limit
      from: 'You''ve hit your usage limit.'
      to: 'Лимит использования исчерпан.'
      boundaries: [telegram.codex_detail]
    - id: telegram.provider_023.codex_limit_retry
      from: 'You''ve hit your usage limit. Try again at {time}.'
      to: 'Лимит использования исчерпан. Повторите попытку в {time}.'
      boundaries: [telegram.codex_detail]
      placeholders: {time: '[^
\n]+'}
    - id: telegram.provider_023.busy_wait
      from: '⏱️ {reason}. Waiting {seconds}s (attempt {attempt}/{limit}){note}...'
      to: '⏱️ Модель или провайдер перегружены. Следующая попытка через {seconds} с ({attempt} из {limit})…'
      boundaries: [telegram.provider_progress]
      placeholders: {reason: 'The free model is busy|Provider overloaded', seconds: '\d+(?:\.\d+)?', attempt: '\d+', limit: '\d+', note: '(?: \(Z\.AI Coding overload (?:adaptive long backoff|short retry)\))?'}
    - id: telegram.provider_023.busy_wait_reset
      from: '⏱️ {reason}. Resets in {window}. Waiting {seconds}s (attempt {attempt}/{limit}){note}...'
      to: '⏱️ Модель или провайдер перегружены. Лимит обновится через {window}. Следующая попытка через {seconds} с ({attempt} из {limit})…'
      boundaries: [telegram.provider_progress]
      placeholders: {reason: 'The free model is busy|Provider overloaded', window: '[~\d][\d.hmsin ]*', seconds: '\d+(?:\.\d+)?', attempt: '\d+', limit: '\d+', note: '(?: \(Z\.AI Coding overload (?:adaptive long backoff|short retry)\))?'}
    - id: telegram.provider_023.quota
      from: '{label} rate-limited every one of {attempts} attempts — its usage limit resets in {window}. Send /retry after that, or switch models with /model. To avoid this in future, add a backup provider with `hermes fallback add`.'
      to: '{label}: лимит запросов сработал во всех попытках ({attempts}). Лимит обновится через {window}. Затем отправьте /retry или смените модель через /model. Чтобы в будущем не ждать, добавьте резервного провайдера командой `hermes fallback add`.'
      boundaries: [telegram.provider_failure]
      placeholders: {label: '[^\r\n]+?', attempts: '\d+', window: '[~\d][\d.hmsin ]*'}
    - id: telegram.provider_023.quota_first
      from: '{label} is rate-limiting requests right now — its usage limit resets in {window}. Send /retry after that, or switch models with /model. To avoid this in future, add a backup provider with `hermes fallback add`.'
      to: '{label} сейчас ограничивает запросы. Лимит обновится через {window}. Затем отправьте /retry или смените модель через /model. Чтобы в будущем не ждать, добавьте резервного провайдера командой `hermes fallback add`.'
      boundaries: [telegram.provider_failure]
      placeholders: {label: '[^\r\n]+?', window: '[~\d][\d.hmsin ]*'}
    - id: telegram.provider_023.exhausted
      from: '{label} {cause} — it looks temporarily unavailable. Wait a minute and send /retry, or switch models with /model. To avoid this in future, add a backup provider with `hermes fallback add`.'
      to: '{label}: сервис временно недоступен. Подождите минуту и отправьте /retry или смените модель через /model. Чтобы в будущем не ждать, добавьте резервного провайдера командой `hermes fallback add`.'
      boundaries: [telegram.provider_failure]
      placeholders: {label: '[^\r\n]+?', cause: 'rate-limited every one of \d+ attempts|is rate-limiting requests right now|reported it was overloaded on all \d+ attempts|returned a server error on all \d+ attempts|didn''t respond in time on any of \d+ attempts|didn''t answer after \d+ attempts'}
    - id: telegram.provider_023.reset_at
      from: 'Limit resets at {time} (in {window}).'
      to: 'Лимит обновится в {time} (через {window}).'
      boundaries: [telegram.provider_reset]
      placeholders: {time: '\d{2}:\d{2}', window: '[\d][\dhm ]*'}
    - id: telegram.provider_023.wait_with_reset
      from: '⏱️ Rate limited. Resets in {window}. Waiting {seconds}s (attempt {attempt}/{limit})...'
      to: '⏱️ Достигнут лимит запросов. Лимит обновится через {window}. Следующая попытка через {seconds} с ({attempt} из {limit})…'
      boundaries: [telegram.provider_progress]
      placeholders: {window: '[~\d][\d.hmsin ]*', seconds: '\d+(?:\.\d+)?', attempt: '\d+', limit: '\d+'}
    - id: telegram.provider_023.wait
      from: '⏱️ Rate limited. Waiting {seconds}s (attempt {attempt}/{limit})...'
      to: '⏱️ Достигнут лимит запросов. Следующая попытка через {seconds} с ({attempt} из {limit})…'
      boundaries: [telegram.provider_progress]
      placeholders: {seconds: '\d+(?:\.\d+)?', attempt: '\d+', limit: '\d+'}
    - id: telegram.provider_023.retry
      from: '⏳ Retrying in {seconds}s (attempt {attempt}/{limit})...'
      to: '⏳ Повтор через {seconds} с ({attempt} из {limit})…'
      boundaries: [telegram.provider_progress]
      placeholders: {seconds: '\d+(?:\.\d+)?', attempt: '\d+', limit: '\d+'}
  turn_notices_023:
    source_file: agent/turn_failure_copy.py + agent/turn_api_call.py
    rules:
    - id: telegram.turn_notice.no_reply
      from: '⚠️ No reply: the model returned empty content after retries and any fallback providers. Try continue, switch model/provider, or inspect the tool output above.'
      to: '⚠️ Нет ответа: модель вернула пустой ответ даже после повторных попыток и обращения к резервным провайдерам. Отправьте `continue`, смените модель или провайдера.'
      boundaries: [telegram.final_turn_notice]
    - id: telegram.turn_notice.failed
      from: Your request was not processed. Send it again if you still want me to carry it out.
      to: Запрос не обработан. Отправьте его ещё раз, если он по-прежнему актуален.
      boundaries:
      - telegram.final_turn_notice
    - id: telegram.turn_notice.partial
      from: This turn did not complete. Some actions may already have run; verify their effects before resending.
      to: Ход не завершился. Часть действий могла выполниться. Проверьте результат перед повторной отправкой.
      boundaries:
      - telegram.final_turn_notice
    - id: telegram.turn_notice.interrupted
      from: 'Operation interrupted: waiting for model response ({seconds}s elapsed).'
      to: Операция прервана во время ожидания ответа модели (прошло {seconds} с).
      boundaries:
      - telegram.final_turn_notice
      placeholders:
        seconds: '[0-9]+[.][0-9]'
    - id: telegram.turn_notice.truncated
      from: The model's reply was cut off before it finished (it hit its output length limit), so Hermes didn't run the incomplete action. Nothing was changed. Send `continue`, ask for the work in smaller steps, or raise max_tokens for this model.
      to: Ответ модели оборвался из-за ограничения длины. Hermes не выполнил действие, которое модель не успела описать. Отправьте `continue`, разбейте задачу на шаги или увеличьте max_tokens для этой модели.
      boundaries:
      - telegram.final_turn_notice
  approval_reasons_023:
    source_file: tools/approval_detection.py + tools/approval.py + tools/file_tools_write_guards.py
    rules:
    - id: telegram.approval.protected_instruction_files
      from: "Write to protected agent-instruction file(s): {targets}. These files steer future agent behavior; approval is always required (not bypassed by auto-approve)."
      to: "Запись в защищённые файлы инструкций агента: {targets}. Эти файлы определяют дальнейшее поведение агента. Операцию нужно подтверждать каждый раз, даже если включено автоподтверждение."
      boundaries: [telegram.approval_reason]
    - id: telegram.approval.ssh_config
      from: "Write to SSH client config file(s): {display_targets}. The SSH config can carry ProxyCommand / Match exec directives that run commands, so writes require your approval."
      to: "Изменение настроек SSH: {display_targets}. SSH используется для удалённого доступа к другим компьютерам. Изменение этих настроек может привести к тому, что при следующей попытке подключения на этом компьютере автоматически запустится команда. Проверьте изменения перед подтверждением."
      boundaries: [telegram.approval_reason]
    - id: telegram.approval.execute_code
      from: "execute_code script execution. The script can spawn subprocesses or mutate files without passing through terminal command approval; approval is one-shot for this run."
      to: "Hermes собирается запустить скрипт через execute_code. Скрипт может запускать программы или менять файлы без отдельных запросов на каждое действие. Подтверждение действует только на этот запуск."
      boundaries: [telegram.approval_reason]
    - id: telegram.approval.plugin
