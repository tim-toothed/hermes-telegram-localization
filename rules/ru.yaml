  requested.agent_init.py:
    source_file: agent/agent_init.py
    rules:
    - id: requested.compression.codex_autoraise
      family: runtime_status
      from: |-
        ℹ️ Codex model {model} has a {context_window} context window; raising the compaction trigger from {old_percent}% to {new_percent}% so more of it is used before summarizing.
           Restore the old trigger: hermes config set compression.codex_gpt55_autoraise false
      to: |-
        ℹ️ Модель Codex {model} имеет окно контекста {context_window}; порог сжатия повышен с {old_percent}% до {new_percent}%, чтобы использовать больше контекста до создания сводки.
           Вернуть прежний порог: hermes config set compression.codex_gpt55_autoraise false
      placeholders:
        model: \S+?
        context_window: \S+?
        old_percent: \d+?
        new_percent: \d+?
    - id: requested.compression.codex_autoraise.current
      family: runtime_status
      from: |-
        ℹ Codex {model} caps context at {context_window}, so auto-compaction was raised to {new_percent}% (from {old_percent}%) to use more of the window before summarizing.
          Opt back out: hermes config set compression.codex_gpt55_autoraise false
      to: |-
        ℹ Codex {model} ограничивает контекст до {context_window}, поэтому порог автоматического сжатия повышен до {new_percent}% (с {old_percent}%), чтобы использовать больше окна до создания сводки.
          Отключить автоповышение: hermes config set compression.codex_gpt55_autoraise false
      placeholders:
        model: \S+?
        context_window: \S+?
        old_percent: \d+?
        new_percent: \d+?
  requested.manual_compression_feedback.py:
    source_file: agent/manual_compression_feedback.py
    rules:
    - id: requested.compression.no_changes
      family: runtime_status
      from: '🗜️ No changes from compression: {count} messages'
      to: '🗜️ Сжатие не изменило контекст: {count} сообщений'
      placeholders:
        count: '[0-9]+'
    - id: requested.compression.token_size_unchanged
      family: runtime_status
      from: 'Approx request size: ~{tokens} tokens (unchanged)'
      to: 'Примерный размер запроса: ~{tokens} токенов (без изменений)'
      placeholders:
        tokens: '[0-9][0-9,]*'
    - id: requested.compression.threshold_exceeded
      family: runtime_warning
      from: ⚠ Context is over the compression threshold ({current_tokens} / {threshold_tokens} tokens), but automatic compression was already attempted this turn. Send /new to start fresh or /compress to retry manually.
      to: ⚠ Контекст превышает порог сжатия ({current_tokens} / {threshold_tokens} токенов), но автоматическое сжатие уже выполнялось в этом запросе. Отправьте /new, чтобы начать новый сеанс, или /compress, чтобы повторить сжатие вручную.
      placeholders:
        current_tokens: '[0-9,]+'
        threshold_tokens: '[0-9,]+'
    - id: requested.compression.success
      family: runtime_status
      from: |-
        ✓ Compressed: {before_messages} → {after_messages} messages
        Approx request size: {token_count} tokens{suffix}
      to: |-
        ✓ Сжато: {before_messages} → {after_messages} сообщений
        Примерный размер запроса: {token_count} токенов{suffix}
      placeholders:
        before_messages: \d+?
        after_messages: \d+?
        token_count: '[0-9,]+'
        suffix: .*?
    - id: requested.compression.in_progress
      family: runtime_warning
      from: |-
        ⚠️ Compression already in progress for this session.
        The current compression holder is still active ({holder}). Use `/compress --cancel` only if it is genuinely stuck.
      to: |-
        ⚠️ Сжатие для этого сеанса уже выполняется.
        Текущий владелец блокировки сжатия всё ещё активен ({holder}). Используйте `/compress --cancel`, только если процесс действительно завис.
      placeholders:
        holder: .*?
    - id: requested.compression.in_progress.current
      family: runtime_warning
      from: '⏳ Compression already in progress for this session (holder: {holder}). Please wait for it to finish.'
      to: '⏳ Сжатие для этого сеанса уже выполняется (holder: {holder}). Дождитесь его завершения.'
      placeholders:
        holder: .*?
    - id: requested.compression.success.current
      family: runtime_status
      from: '🗜️ Compressed: {before_messages} → {after_messages} messages'
      to: '🗜️ Сжато: {before_messages} → {after_messages} сообщений'
      placeholders:
        before_messages: \d+?
        after_messages: \d+?
    - id: requested.compression.token_size.current
      family: runtime_status
      from: 'Approx request size: ~{before_tokens} → ~{after_tokens} tokens'
      to: 'Примерный размер запроса: ~{before_tokens} → ~{after_tokens} токенов'
      placeholders:
        before_tokens: '[0-9,]+'
        after_tokens: '[0-9,]+'
  requested.conversation_compression.py:
    source_file: agent/conversation_compression.py
    rules:
    - id: requested.compression.start
      family: runtime_status
      from: Compacting context — summarizing earlier conversation so I can continue...
      to: Сжимаю контекст — создаю сводку предыдущей части диалога, чтобы продолжить...
    - id: requested.compression.start.current
      family: runtime_status
      from: 🗜️ Compacting context — summarizing earlier conversation so I can continue...
      to: 🗜️ Сжимаю контекст — создаю сводку предыдущей части диалога, чтобы продолжить...
    - id: requested.compression.heartbeat.current
      family: runtime_status
      from: 🗜️ Compacting context — still summarizing earlier conversation so I can continue...
      to: 🗜️ Сжимаю контекст — всё ещё создаю сводку предыдущей части диалога, чтобы продолжить...
    - id: requested.compression.threshold_blocked.current
      family: runtime_warning
      from: ⚠ Context is over the compression threshold (~{current_tokens} tokens >= {threshold_tokens}) but compression is currently blocked ({reason}). The model may stop responding. Run /new to start a fresh session or /compress to retry immediately.
      to: ⚠ Контекст превышает порог сжатия (~{current_tokens} токенов >= {threshold_tokens}), но сжатие сейчас заблокировано ({reason}). Модель может перестать отвечать. Используйте /new для нового сеанса или /compress, чтобы немедленно повторить сжатие.
      placeholders:
        current_tokens: '[0-9,]+'
        threshold_tokens: '[0-9,]+'
        reason: .*?
  requested.turn_recovery.py:
    source_file: agent/turn_recovery.py
    rules:
    - id: requested.provider.fallback_unreachable
      family: runtime_status
      from: ⚠️ Provider unreachable — switching to fallback provider...
      to: ⚠️ Провайдер недоступен — переключаюсь на резервного провайдера...
  requested.chat_completion_helpers.py:
    source_file: agent/chat_completion_helpers.py
    rules:
    - id: requested.provider.fallback.current
      family: runtime_status
      from: '⚠️ Model fallback: {old_model} via {old_provider} unavailable ({reason}); using {new_model} via {new_provider}.'
      to: '⚠️ Резервная модель: {old_model} через {old_provider} недоступна ({reason}); используется {new_model} через {new_provider}.'
      placeholders:
        old_model: .+?
        old_provider: .+?
        reason: .*?
        new_model: .+?
        new_provider: .+?
  requested.gateway.run.py:
    source_file: gateway/run.py
    rules:
    - id: requested.gateway.busy_model_switch
      family: gateway
      from: Agent is running — wait or /stop first, then switch models.
      to: Агент выполняет запрос — дождитесь завершения или сначала используйте /stop, затем переключите модель.
  requested.gateway.run_turn.py:
    source_file: gateway/run_turn.py
    rules:
    - id: requested.session.daily_reset
      family: gateway
      from: |-
        ◐ Session automatically reset (daily schedule at {reset_time}). Conversation history cleared.
        Use /resume to continue a previous session, or just keep chatting to start fresh.
        Adjust reset behavior in config.yaml under session_reset.
      to: |-
        ◐ Сеанс автоматически сброшен (ежедневно в {reset_time}). История диалога очищена.
        Используйте /resume, чтобы продолжить предыдущий сеанс, или просто начните новый диалог.
        Настройте сброс в config.yaml в разделе session_reset.
      placeholders:
        reset_time: '[0-9]{1,2}:[0-9]{2}'
    - id: requested.session.daily_reset.current
      family: gateway
      from: |-
        ◐ Session automatically reset (daily schedule at {reset_time}). Conversation history cleared.
        Use /resume to browse and restore a previous session.
        Adjust reset timing in config.yaml under session_reset.{session_info}
      to: |-
        ◐ Сеанс автоматически сброшен (ежедневно в {reset_time}). История диалога очищена.
        Используйте /resume, чтобы найти и восстановить предыдущий сеанс.
        Настройте время сброса в config.yaml в разделе session_reset.{session_info}
      placeholders:
        reset_time: '[0-9]{1,2}:[0-9]{2}'
        session_info: .*?

  hermes.cli.tips.py:
    source_file: hermes_cli/tips.py
    rules:
    - id: cli_tips.tip_001
      family: cli_tips
      from: /bg <prompt> runs a task in a separate session while your current one stays free; /btw <question> answers a side question about this conversation without interrupting it.
      to: /bg <prompt> запускает задачу в отдельном сеансе, оставляя текущий свободным; /btw <question> отвечает на дополнительный вопрос по этому диалогу, не прерывая его.
    - id: cli_tips.tip_002
      family: cli_tips
      from: /branch forks the current session so you can explore a different direction without losing progress.
      to: /branch создаёт ответвление текущего сеанса, чтобы вы могли попробовать другой подход, не теряя прогресс.
    - id: cli_tips.tip_003
      family: cli_tips
      from: /compress manually compresses conversation context when things get long.
      to: /compress вручную сжимает контекст затянувшегося диалога.
    - id: cli_tips.tip_004
      family: cli_tips
      from: /rollback lists filesystem checkpoints — restore files the agent modified to any prior state.
      to: /rollback показывает контрольные точки файловой системы — восстановите изменённые агентом файлы до любого предыдущего состояния.
    - id: cli_tips.tip_005
      family: cli_tips
      from: /rollback diff 2 previews what changed since checkpoint 2 without restoring anything.
      to: /rollback diff 2 показывает изменения с контрольной точки 2, ничего не восстанавливая.
    - id: cli_tips.tip_006
      family: cli_tips
      from: /rollback 2 src/file.py restores a single file from a specific checkpoint.
      to: /rollback 2 src/file.py восстанавливает один файл из указанной контрольной точки.
    - id: cli_tips.tip_007
      family: cli_tips
      from: /title "my project" names your session — resume it later with /resume or hermes -c.
      to: /title "my project" задаёт название сеанса — позднее продолжите его через /resume или hermes -c.
    - id: cli_tips.tip_008
      family: cli_tips
      from: /resume picks up where you left off in a previously named session.
      to: /resume продолжает ранее названный сеанс с того места, где вы остановились.
    - id: cli_tips.tip_009
      family: cli_tips
      from: /queue <prompt> queues a message for the next turn without interrupting the current one.
      to: /queue <prompt> ставит сообщение в очередь на следующий ход, не прерывая текущий.
    - id: cli_tips.tip_010
      family: cli_tips
      from: /undo removes the last user/assistant exchange from the conversation.
      to: /undo удаляет из диалога последний обмен сообщениями пользователя и ассистента.
    - id: cli_tips.tip_011
      family: cli_tips
      from: /retry resends your last message — useful when the agent's response wasn't quite right.
      to: /retry повторно отправляет ваше последнее сообщение — полезно, если ответ агента оказался неудачным.
    - id: cli_tips.tip_012
      family: cli_tips
      from: '/verbose cycles tool progress display: off → new → all → verbose.'
      to: '/verbose переключает отображение работы инструментов: off → new → all → verbose.'
    - id: cli_tips.tip_013
      family: cli_tips
      from: /reasoning high increases the model's thinking depth. /reasoning show displays the reasoning.
      to: /reasoning high увеличивает глубину рассуждений модели. /reasoning show показывает рассуждения.
    - id: cli_tips.tip_014
      family: cli_tips
      from: /fast toggles priority processing for faster API responses (provider-dependent).
      to: /fast переключает приоритетную обработку для более быстрых ответов API (зависит от провайдера).
    - id: cli_tips.tip_015
      family: cli_tips
      from: /yolo skips all dangerous command approval prompts for the rest of the session.
      to: /yolo отключает все запросы подтверждения опасных команд до конца сеанса.
    - id: cli_tips.tip_016
      family: cli_tips
      from: /model lets you switch models mid-session — try /model sonnet or /model gpt-5.
      to: /model позволяет сменить модель во время сеанса — попробуйте /model sonnet или /model gpt-5.
    - id: cli_tips.tip_017
      family: cli_tips
      from: /model --global changes your default model permanently.
      to: /model --global сохраняет выбранную модель как модель по умолчанию.
    - id: cli_tips.tip_018
      family: cli_tips
      from: /personality pirate sets a fun personality — 14 built-in options from kawaii to shakespeare.
      to: /personality pirate задаёт забавный характер — доступны 14 встроенных вариантов от kawaii до shakespeare.
    - id: cli_tips.tip_019
      family: cli_tips
      from: /skin changes the CLI theme — try ares, mono, slate, poseidon, or charizard.
      to: /skin меняет тему CLI — попробуйте ares, mono, slate, poseidon или charizard.
    - id: cli_tips.tip_020
      family: cli_tips
      from: /statusbar toggles a persistent bar showing model, tokens, context fill %, cost, and duration.
      to: /statusbar переключает постоянную строку состояния с моделью, токенами, заполнением контекста в %, стоимостью и длительностью.
    - id: cli_tips.tip_021
      family: cli_tips
      from: /tools disable browser temporarily removes browser tools for the current session.
      to: /tools disable browser временно отключает браузерные инструменты в текущем сеансе.
    - id: cli_tips.tip_022
      family: cli_tips
      from: /browser connect attaches browser tools to your running Chromium-family browser via CDP.
      to: /browser connect подключает браузерные инструменты к вашему запущенному браузеру семейства Chromium через CDP.
    - id: cli_tips.tip_023
      family: cli_tips
      from: /plugins lists installed plugins and their status.
      to: /plugins показывает установленные плагины и их состояние.
    - id: cli_tips.tip_024
      family: cli_tips
      from: /cron manages scheduled tasks — set up recurring prompts with delivery to any platform.
      to: /cron управляет задачами по расписанию — настройте повторяющиеся запросы с доставкой на любую платформу.
    - id: cli_tips.tip_025
      family: cli_tips
      from: /reload-mcp hot-reloads MCP server configuration without restarting.
      to: /reload-mcp перезагружает конфигурацию серверов MCP без перезапуска.
    - id: cli_tips.tip_026
      family: cli_tips
      from: /usage shows token usage, cost breakdown, and session duration.
      to: /usage показывает расход токенов, разбивку стоимости и длительность сеанса.
    - id: cli_tips.tip_027
      family: cli_tips
      from: /insights shows usage analytics for the last 30 days.
      to: /insights показывает аналитику использования за последние 30 дней.
    - id: cli_tips.tip_028
      family: cli_tips
      from: /paste checks your clipboard for an image and attaches it to your next message.
      to: /paste проверяет наличие изображения в буфере обмена и прикрепляет его к следующему сообщению.
    - id: cli_tips.tip_029
      family: cli_tips
      from: /profile shows which profile is active and its home directory.
      to: /profile показывает активный профиль и его домашний каталог.
    - id: cli_tips.tip_030
      family: cli_tips
      from: /config shows your current configuration at a glance.
      to: /config кратко показывает текущую конфигурацию.
    - id: cli_tips.tip_031
      family: cli_tips
      from: /stop kills all running background processes spawned by the agent.
      to: /stop завершает все работающие фоновые процессы, запущенные агентом.
    - id: cli_tips.tip_032
      family: cli_tips
      from: '@file:path/to/file.py injects file contents directly into your message.'
      to: '@file:path/to/file.py вставляет содержимое файла прямо в ваше сообщение.'
    - id: cli_tips.tip_033
      family: cli_tips
      from: '@file:main.py:10-50 injects only lines 10-50 of a file.'
      to: '@file:main.py:10-50 вставляет только строки 10-50 файла.'
    - id: cli_tips.tip_034
      family: cli_tips
      from: '@folder:src/ injects a directory tree listing.'
      to: '@folder:src/ вставляет дерево каталогов.'
    - id: cli_tips.tip_035
      family: cli_tips
      from: '@diff injects your unstaged git changes into the message.'
      to: '@diff вставляет в сообщение изменения git, ещё не добавленные в индекс.'
    - id: cli_tips.tip_036
      family: cli_tips
      from: '@staged injects your staged git changes (git diff --staged).'
      to: '@staged вставляет изменения git, добавленные в индекс (git diff --staged).'
    - id: cli_tips.tip_037
      family: cli_tips
      from: '@git:5 injects the last 5 commits with full patches.'
      to: '@git:5 вставляет последние 5 коммитов с полными патчами.'
    - id: cli_tips.tip_038
      family: cli_tips
      from: '@url:https://example.com fetches and injects a web page''s content.'
      to: '@url:https://example.com загружает и вставляет содержимое веб-страницы.'
    - id: cli_tips.tip_039
      family: cli_tips
      from: Typing @ triggers filesystem path completion — navigate to any file interactively.
      to: Ввод @ включает автодополнение путей файловой системы — выбирайте любой файл интерактивно.
    - id: cli_tips.tip_040
      family: cli_tips
      from: 'Combine multiple references: "Review @file:main.py and @file:test.py for consistency."'
      to: 'Объединяйте несколько ссылок: «Проверь согласованность @file:main.py и @file:test.py».'
    - id: cli_tips.tip_041
      family: cli_tips
      from: Alt+Enter inserts a newline for multi-line input. (Windows Terminal intercepts Alt+Enter — use Ctrl+Enter instead.)
      to: Alt+Enter вставляет новую строку для многострочного ввода. (Windows Terminal перехватывает Alt+Enter — используйте Ctrl+Enter.)
    - id: cli_tips.tip_042
      family: cli_tips
      from: Ctrl+C interrupts the agent. Double-press within 2 seconds to force exit.
      to: Ctrl+C прерывает агента. Двойное нажатие в течение 2 секунд принудительно завершает работу.
    - id: cli_tips.tip_043
      family: cli_tips
      from: Ctrl+Z suspends Hermes to the background — run fg in your shell to resume.
      to: Ctrl+Z приостанавливает Hermes и переводит его в фон — выполните fg в оболочке, чтобы продолжить.
    - id: cli_tips.tip_044
      family: cli_tips
      from: Tab accepts auto-suggestion ghost text or autocompletes slash commands.
      to: Tab принимает подсказку автодополнения или дополняет команды с косой чертой.
    - id: cli_tips.tip_045
      family: cli_tips
      from: Type a new message while the agent is working to interrupt and redirect it.
      to: Введите новое сообщение во время работы агента, чтобы прервать его и изменить направление работы.
    - id: cli_tips.tip_046
      family: cli_tips
      from: Alt+V pastes an image from your clipboard into the conversation.
      to: Alt+V вставляет изображение из буфера обмена в диалог.
    - id: cli_tips.tip_047
      family: cli_tips
      from: Pasting 5+ lines auto-saves to a file and inserts a compact reference instead.
      to: При вставке 5 и более строк текст автоматически сохраняется в файл, а вместо него вставляется компактная ссылка.
    - id: cli_tips.tip_048
      family: cli_tips
      from: hermes -c resumes your most recent CLI session. hermes -c "project name" resumes by title.
      to: hermes -c продолжает последний сеанс CLI. hermes -c "project name" продолжает сеанс по названию.
    - id: cli_tips.tip_049
      family: cli_tips
      from: hermes -w creates an isolated git worktree — perfect for parallel agent workflows.
      to: hermes -w создаёт изолированное рабочее дерево git — удобно для параллельной работы агентов.
    - id: cli_tips.tip_050
      family: cli_tips
      from: 'hermes -w -q "Fix issue #42" combines worktree isolation with a one-shot query.'
      to: 'hermes -w -q "Fix issue #42" сочетает изоляцию рабочего дерева с разовым запросом.'
    - id: cli_tips.tip_051
      family: cli_tips
      from: hermes chat -t web,terminal enables only specific toolsets for a focused session.
      to: hermes chat -t web,terminal включает только указанные наборы инструментов для целевого сеанса.
    - id: cli_tips.tip_052
