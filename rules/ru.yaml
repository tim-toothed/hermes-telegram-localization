      to: hermes doctor --fix диагностирует и автоматически исправляет проблемы конфигурации и зависимостей.
    - id: cli_tips.tip_060
      family: cli_tips
      from: hermes dump outputs a compact setup summary — great for bug reports.
      to: hermes dump выводит компактную сводку настроек — удобно для сообщений об ошибках.
    - id: cli_tips.tip_061
      family: cli_tips
      from: hermes config set KEY VALUE auto-routes secrets to .env and everything else to config.yaml.
      to: hermes config set KEY VALUE автоматически сохраняет секреты в .env, а остальные параметры — в config.yaml.
    - id: cli_tips.tip_062
      family: cli_tips
      from: hermes config edit opens config.yaml in your default editor.
      to: hermes config edit открывает config.yaml в редакторе по умолчанию.
    - id: cli_tips.tip_063
      family: cli_tips
      from: hermes config check scans for missing or stale configuration options.
      to: hermes config check ищет отсутствующие или устаревшие параметры конфигурации.
    - id: cli_tips.tip_064
      family: cli_tips
      from: hermes sessions browse opens an interactive session picker with search.
      to: hermes sessions browse открывает интерактивный выбор сеанса с поиском.
    - id: cli_tips.tip_065
