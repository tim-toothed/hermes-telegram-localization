      to: Файлы AGENTS.md во вложенных каталогах обнаруживаются постепенно, по мере перехода агента в эти папки.
    - id: cli_tips.tip_179
      family: cli_tips
      from: Context files are capped at 20,000 characters with smart head/tail truncation.
      to: Файлы контекста ограничены 20 000 символами; при сокращении сохраняются важные части начала и конца.
    - id: cli_tips.tip_180
      family: cli_tips
      from: 'Five browser providers: local Chromium, Browserbase, Browser Use, Camofox, and Firecrawl.'
      to: 'Пять провайдеров браузера: локальный Chromium, Browserbase, Browser Use, Camofox и Firecrawl.'
    - id: cli_tips.tip_181
      family: cli_tips
      from: Camofox is an anti-detection browser — Firefox fork with C++ fingerprint spoofing.
      to: Camofox — браузер с защитой от обнаружения, ответвление Firefox с подменой отпечатка на C++.
    - id: cli_tips.tip_182
      family: cli_tips
