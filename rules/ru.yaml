      from: hermes sessions stats shows session counts by platform and database size.
      to: hermes sessions stats показывает число сеансов по платформам и размер базы данных.
    - id: cli_tips.tip_066
      family: cli_tips
      from: hermes sessions prune --older-than 30 cleans up old sessions.
      to: hermes sessions prune --older-than 30 удаляет старые сеансы.
    - id: cli_tips.tip_067
      family: cli_tips
      from: hermes skills search react --source skills-sh searches the skills.sh public directory.
      to: hermes skills search react --source skills-sh ищет навыки в открытом каталоге skills.sh.
    - id: cli_tips.tip_068
      family: cli_tips
      from: hermes skills check scans installed hub skills for upstream updates.
      to: hermes skills check проверяет установленные через каталог навыки на наличие обновлений в источнике.
    - id: cli_tips.tip_069
      family: cli_tips
      from: hermes skills tap add myorg/skills-repo adds a custom GitHub skill source.
      to: hermes skills tap add myorg/skills-repo добавляет собственный источник навыков на GitHub.
    - id: cli_tips.tip_070
      family: cli_tips
      from: hermes skills snapshot export setup.json exports your skill configuration for backup or sharing.
      to: hermes skills snapshot export setup.json экспортирует конфигурацию навыков для резервного копирования или обмена.
    - id: cli_tips.tip_071
      family: cli_tips
      from: hermes mcp add github --command npx adds MCP servers from the command line.
      to: hermes mcp add github --command npx добавляет серверы MCP из командной строки.
    - id: cli_tips.tip_072
      family: cli_tips
      from: hermes mcp serve runs Hermes itself as an MCP server for other agents.
      to: hermes mcp serve запускает сам Hermes как сервер MCP для других агентов.
    - id: cli_tips.tip_073
      family: cli_tips
      from: hermes auth add lets you add multiple API keys for credential pool rotation.
      to: hermes auth add позволяет добавить несколько API-ключей для ротации в пуле учётных данных.
    - id: cli_tips.tip_074
      family: cli_tips
      from: hermes completion bash >> ~/.bashrc enables tab completion for all commands and profiles.
      to: hermes completion bash >> ~/.bashrc включает дополнение по Tab для всех команд и профилей.
    - id: cli_tips.tip_075
      family: cli_tips
      from: hermes logs -f follows agent.log in real time. --level WARNING --since 1h filters output.
      to: hermes logs -f показывает agent.log в реальном времени. --level WARNING --since 1h фильтрует вывод.
    - id: cli_tips.tip_076
      family: cli_tips
      from: hermes backup creates a zip backup of your entire Hermes home directory.
      to: hermes backup создаёт резервную копию всего домашнего каталога Hermes в формате zip.
    - id: cli_tips.tip_077
      family: cli_tips
      from: hermes profile create coder creates an isolated profile that becomes its own command.
      to: hermes profile create coder создаёт изолированный профиль с собственной командой запуска.
    - id: cli_tips.tip_078
      family: cli_tips
      from: hermes profile create work --clone copies your current config and keys to a new profile.
      to: hermes profile create work --clone копирует текущую конфигурацию и ключи в новый профиль.
    - id: cli_tips.tip_079
      family: cli_tips
      from: hermes update syncs new bundled skills to ALL profiles automatically.
      to: hermes update автоматически добавляет новые встроенные навыки во ВСЕ профили.
    - id: cli_tips.tip_080
      family: cli_tips
      from: hermes gateway install sets up Hermes as a system service (systemd/launchd).
      to: hermes gateway install устанавливает Hermes как системный сервис (systemd/launchd).
    - id: cli_tips.tip_081
      family: cli_tips
      from: hermes memory setup lets you configure an external memory provider (Honcho, Mem0, etc.).
      to: hermes memory setup позволяет настроить внешнего провайдера памяти (Honcho, Mem0 и другие).
    - id: cli_tips.tip_082
      family: cli_tips
      from: hermes webhook subscribe creates event-driven webhook routes with HMAC validation.
      to: hermes webhook subscribe создаёт маршруты вебхуков, запускаемые событиями, с проверкой HMAC.
    - id: cli_tips.tip_083
      family: cli_tips
      from: 'Save money: hermes tools disables unused tools, hermes skills config trims skills down.'
      to: 'Экономьте: hermes tools отключает неиспользуемые инструменты, hermes skills config сокращает набор навыков.'
    - id: cli_tips.tip_084
      family: cli_tips
      from: /reasoning low or /reasoning minimal cuts thinking depth below the default (medium) — faster, cheaper responses.
      to: /reasoning low или /reasoning minimal уменьшает глубину рассуждений относительно значения по умолчанию (medium) — ответы быстрее и дешевле.
    - id: cli_tips.tip_085
      family: cli_tips
      from: hermes models routes vision, compression, and aux tasks to cheaper models — cuts background token cost 85%+ without downgrading your main chat model.
      to: hermes models направляет задачи анализа изображений, сжатия и вспомогательные задачи на более дешёвые модели — снижает фоновую стоимость токенов на 85% и более без смены основной модели диалога.
    - id: cli_tips.tip_086
      family: cli_tips
      from: 'Set display.bell_on_complete: true in config.yaml to hear a bell when long tasks finish.'
      to: 'Установите display.bell_on_complete: true в config.yaml, чтобы слышать звуковой сигнал при завершении долгих задач.'
    - id: cli_tips.tip_087
      family: cli_tips
      from: 'Set display.streaming: true to see tokens appear in real time as the model generates.'
      to: 'Установите display.streaming: true, чтобы видеть появление токенов в реальном времени при генерации ответа.'
    - id: cli_tips.tip_088
      family: cli_tips
      from: 'Set display.show_reasoning: true to watch the model''s chain-of-thought reasoning.'
      to: 'Установите display.show_reasoning: true, чтобы видеть цепочку рассуждений модели.'
    - id: cli_tips.tip_089
      family: cli_tips
      from: 'Set display.compact: true to reduce whitespace in output for denser information.'
      to: 'Установите display.compact: true, чтобы уменьшить пустое пространство и сделать вывод плотнее.'
    - id: cli_tips.tip_090
      family: cli_tips
      from: 'Set display.busy_input_mode: queue to queue messages instead of interrupting the agent, or steer to inject them mid-run via /steer.'
      to: 'Установите display.busy_input_mode: queue, чтобы ставить сообщения в очередь вместо прерывания агента, или steer, чтобы передавать их во время работы через /steer.'
    - id: cli_tips.tip_091
      family: cli_tips
      from: 'Set display.resume_display: minimal to skip the full conversation recap on session resume.'
      to: 'Установите display.resume_display: minimal, чтобы пропускать полный обзор диалога при продолжении сеанса.'
    - id: cli_tips.tip_092
      family: cli_tips
      from: 'Set compression.threshold: 0.50 to control when auto-compression fires (default: 50% of context).'
      to: 'Установите compression.threshold: 0.50, чтобы задать порог автосжатия (по умолчанию: 50% контекста).'
    - id: cli_tips.tip_093
      family: cli_tips
      from: 'Set agent.max_turns: 1000 to let the agent take more tool-calling steps per turn.'
      to: 'Установите agent.max_turns: 1000, чтобы разрешить агенту больше шагов вызова инструментов за ход.'
    - id: cli_tips.tip_094
      family: cli_tips
      from: 'Set file_read_max_chars: 200000 to increase the max content per read_file call.'
      to: 'Установите file_read_max_chars: 200000, чтобы увеличить максимальный объём содержимого за один вызов read_file.'
    - id: cli_tips.tip_095
      family: cli_tips
      from: 'Set approvals.mode: smart to let an LLM auto-approve safe commands and auto-deny dangerous ones.'
      to: 'Установите approvals.mode: smart, чтобы LLM автоматически разрешала безопасные команды и отклоняла опасные.'
    - id: cli_tips.tip_096
      family: cli_tips
      from: Set fallback_model in config.yaml to automatically fail over to a backup provider.
      to: Задайте fallback_model в config.yaml для автоматического переключения на резервного провайдера при сбое.
    - id: cli_tips.tip_097
      family: cli_tips
      from: 'Set privacy.redact_pii: true to hash user IDs and phone numbers before sending to the LLM.'
      to: 'Установите privacy.redact_pii: true, чтобы хешировать ID пользователей и номера телефонов перед отправкой в LLM.'
    - id: cli_tips.tip_098
      family: cli_tips
      from: 'Set browser.record_sessions: true to auto-record browser sessions as WebM videos.'
      to: 'Установите browser.record_sessions: true для автоматической записи браузерных сеансов в видео WebM.'
    - id: cli_tips.tip_099
      family: cli_tips
      from: 'Set worktree: true in config.yaml to always create a git worktree (same as hermes -w).'
      to: 'Установите worktree: true в config.yaml, чтобы всегда создавать рабочее дерево git (как при hermes -w).'
    - id: cli_tips.tip_100
      family: cli_tips
      from: 'Set security.website_blocklist.enabled: true to block specific domains from web tools.'
      to: 'Установите security.website_blocklist.enabled: true, чтобы блокировать доступ веб-инструментов к указанным доменам.'
    - id: cli_tips.tip_101
      family: cli_tips
      from: 'Set cron.wrap_response: false to deliver raw agent output without the cron header/footer.'
      to: 'Установите cron.wrap_response: false, чтобы доставлять исходный ответ агента без заголовка и подвала Cron.'
    - id: cli_tips.tip_102
      family: cli_tips
      from: HERMES_TIMEZONE overrides the server timezone with any IANA timezone string.
      to: HERMES_TIMEZONE заменяет часовой пояс сервера на любой часовой пояс в формате IANA.
    - id: cli_tips.tip_103
      family: cli_tips
      from: 'Environment variable substitution works in config.yaml: use ${env_example} syntax.'
      to: 'В config.yaml работает подстановка переменных окружения: используйте синтаксис ${env_example}.'
      placeholders:
        env_example: \{VAR_NAME\}
    - id: cli_tips.tip_104
      family: cli_tips
      from: Quick commands in config.yaml run shell commands instantly with zero token usage.
      to: Быстрые команды в config.yaml мгновенно выполняют команды оболочки без расхода токенов.
    - id: cli_tips.tip_105
      family: cli_tips
      from: Custom personalities can be defined in config.yaml under agent.personalities.
      to: Собственные характеры можно определить в config.yaml в разделе agent.personalities.
    - id: cli_tips.tip_106
      family: cli_tips
      from: provider_routing controls OpenRouter provider sorting, whitelisting, and blacklisting.
      to: provider_routing управляет сортировкой провайдеров OpenRouter, списками разрешённых и запрещённых провайдеров.
    - id: cli_tips.tip_107
      family: cli_tips
      from: execute_code runs Python scripts that call Hermes tools programmatically — results stay out of context.
      to: execute_code выполняет скрипты Python, которые программно вызывают инструменты Hermes — результаты не попадают в контекст.
    - id: cli_tips.tip_108
      family: cli_tips
      from: delegate_task spawns up to 3 concurrent sub-agents by default (delegation.max_concurrent_children) with isolated contexts for parallel work.
      to: delegate_task по умолчанию запускает до 3 параллельных субагентов (delegation.max_concurrent_children) с изолированными контекстами.
    - id: cli_tips.tip_109
      family: cli_tips
      from: web_extract works on PDF URLs — pass any PDF link and it converts to markdown.
      to: web_extract работает с URL файлов PDF — передайте ссылку на PDF, чтобы преобразовать его в Markdown.
    - id: cli_tips.tip_110
      family: cli_tips
      from: search_files is ripgrep-backed and faster than grep — use it instead of terminal grep.
      to: search_files использует ripgrep и работает быстрее grep — используйте его вместо grep в терминале.
    - id: cli_tips.tip_111
      family: cli_tips
      from: patch uses 9 fuzzy matching strategies so minor whitespace differences won't break edits.
      to: patch применяет 9 стратегий нечёткого сопоставления, поэтому небольшие различия в пробелах не мешают правкам.
    - id: cli_tips.tip_112
      family: cli_tips
      from: patch supports V4A format for bulk multi-file edits in a single call.
      to: patch поддерживает формат V4A для массовых правок нескольких файлов за один вызов.
    - id: cli_tips.tip_113
      family: cli_tips
      from: read_file suggests similar filenames when a file isn't found.
      to: read_file предлагает похожие имена, если файл не найден.
    - id: cli_tips.tip_114
      family: cli_tips
